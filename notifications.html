<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathfynder — Notifications</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F5C43">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pathfynder">
<script src="/js/pf-notify-v1.js" defer></script>
<style>
  :root { --accent: #0F5C43; --dark: #163C32; --bg: #EEF0EC; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 16px; padding: 32px 24px; max-width: 380px; width: 100%; text-align: center; }
  .label-line { font-size: 14px; color: var(--dark); opacity: 0.7; margin: 0 0 16px; }
  h1 { font-size: 18px; margin: 0 0 20px; color: var(--dark); }
  p { font-size: 15px; line-height: 1.5; color: var(--dark); opacity: 0.85; margin: 0 0 20px; }
  .pill-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
  .pill-text { font-size: 15px; font-weight: 600; }
  .toggle { position: relative; width: 52px; height: 30px; border-radius: 999px; border: none; background: #ccc; cursor: pointer; transition: background 0.2s; flex: none; }
  .toggle.is-on { background: var(--accent); }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
  .toggle.is-on::after { transform: translateX(22px); }
  .toggle:disabled { opacity: 0.5; cursor: default; }
  ol { text-align: left; font-size: 15px; line-height: 1.6; color: var(--dark); padding-left: 20px; margin: 0 0 20px; }
  .btn { appearance: none; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; padding: 12px 24px; border-radius: 999px; cursor: pointer; }
  .btn--ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
</style>
</head>
<body>
  <div class="card" id="card">
    <p>Loading…</p>
  </div>

<script>
(function () {
  'use strict';

  function qs(name) {
    return new URLSearchParams(location.search).get(name);
  }
  var token = qs('t') || null;
  var card = document.getElementById('card');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderToggle(label, isOn) {
    card.innerHTML =
      (label ? '<p class="label-line">Alerts for ' + esc(label) + '</p>' : '') +
      '<h1>Ride alerts</h1>' +
      '<div class="pill-row">' +
        '<span class="pill-text" id="pillText">' + (isOn ? "You're on" : "Turn on alerts") + '</span>' +
        '<button type="button" class="toggle' + (isOn ? ' is-on' : '') + '" id="toggleBtn" aria-pressed="' + isOn + '"></button>' +
      '</div>' +
      '<p>Get a WhatsApp-style notification the moment a matching ride is posted.</p>';

    var btn = document.getElementById('toggleBtn');
    var pillText = document.getElementById('pillText');
    var on = isOn;

    function setPill(isOn) {
      on = isOn;
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', on);
      pillText.textContent = on ? "You're on" : 'Turn on alerts';
    }

    btn.addEventListener('click', function () {
      btn.disabled = true;
      var action = on ? window.PFNotify.disable(token) : window.PFNotify.enable(token);
      action.then(function (newState) {
        setPill(on ? false : newState === 'granted');
        btn.disabled = false;
      }).catch(function () {
        btn.disabled = false;
      });
    });
  }

  function renderIOSInstall(tooOld) {
    if (tooOld) {
      card.innerHTML =
        '<h1>Update iOS to get alerts</h1>' +
        '<p>Ride alerts need iOS 16.4 or later. Update iOS in Settings, then come back to this page.</p>';
      return;
    }
    card.innerHTML =
      '<h1>Add Pathfynder to your Home Screen</h1>' +
      '<ol>' +
        '<li>Tap the Share button in Safari</li>' +
        '<li>Choose "Add to Home Screen"</li>' +
        '<li>Open Pathfynder from your Home Screen, then come back here to turn on alerts</li>' +
      '</ol>';
  }

  function renderBlocked(reasonInApp) {
    var link = location.href;
    card.innerHTML =
      (reasonInApp
        ? '<h1>Open in your browser</h1><p>Notifications don’t work inside this app. Copy the link below and open it in Chrome or Safari.</p>'
        : '<h1>Notifications are blocked</h1><p>Enable notifications for this site in your browser settings, then reload this page.</p>') +
      '<button type="button" class="btn btn--ghost" id="copyBtn">Copy link</button>';

    var copyBtn = document.getElementById('copyBtn');
    copyBtn.addEventListener('click', function () {
      var done = function () { copyBtn.textContent = 'Copied!'; setTimeout(function () { copyBtn.textContent = 'Copy link'; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done).catch(function () { window.prompt('Copy this link:', link); });
      } else {
        window.prompt('Copy this link:', link);
      }
    });
  }

  function render(label, state, isOn) {
    if (state === 'ios-needs-install' || state === 'ios-too-old') {
      renderIOSInstall(state === 'ios-too-old');
    } else if (state === 'denied' || state === 'in-app-browser' || state === 'unsupported') {
      renderBlocked(state === 'in-app-browser');
    } else {
      renderToggle(label, isOn);
    }
  }

  function boot() {
    var state = window.PFNotify.state();
    window.PFNotify.status(token).then(function (data) {
      render(data && data.label, state, !!(data && data.on));
    }).catch(function () {
      render(null, state, false);
    });
  }

  if (window.PFNotify) boot();
  else window.addEventListener('load', boot);
})();
</script>
</body>
</html>
