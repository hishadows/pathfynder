<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F5C43">
<link rel="icon" type="image/png" href="/logo.png">
<title>Join a ride · Pathfynder</title>
<style>
:root{
  --header:#0F5C43; --header-text:#FFFFFF;
  --primary:#0F5C43; --cta:#0F5C43; --cta-text:#FFFFFF; --cta-hover:#163C32;
  --bg:#EEF0EC; --card:#FFFFFF; --muted:#F5F7F4;
  --text:#14231D; --text-2:#5F6F68; --divider:#DDE3DE;
  --chip:#E3F1EA; --chip-text:#0F5C43; --danger:#C62828; --danger-bg:#FBEAEA;
  --dot-o:#0F5C43; --dot-d:#163C32; --shadow:0 1px 3px rgba(20,35,29,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --header:#163C32; --header-text:#E6EDE9;
    --primary:#4CB68A; --cta:#1F7A5A; --cta-text:#FFFFFF; --cta-hover:#25896A;
    --bg:#0E1512; --card:#16211C; --muted:#1B2823;
    --text:#E6EDE9; --text-2:#93A69C; --divider:#263530;
    --chip:#173328; --chip-text:#6FD3A6; --danger:#F27C7C; --danger-bg:#3A1F1F;
    --dot-o:#4CB68A; --dot-d:#9BD9BC; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit}
.bar{background:var(--header);color:var(--header-text)}
.bar__in{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;max-width:560px;margin:0 auto}
.brand{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#FFFFFF;flex:none;overflow:hidden}
.brand img{width:22px;height:22px;object-fit:contain}
.bar h1{margin:0;font-size:18px;font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--divider);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
/* Trip card */
.t-head{display:flex;align-items:center;gap:8px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--primary);color:#FFFFFF;display:grid;place-items:center;font-weight:700;font-size:18px}
.t-who{flex:1;min-width:0;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;background:var(--chip);color:var(--chip-text)}
.t-msg{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--chip-text);text-decoration:none}
.t-msg:hover{filter:brightness(.97)}
.t-msg:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.t-when{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--chip);color:var(--chip-text);font-size:17px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.route__lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-bottom:2px}
.route{display:grid;grid-template-columns:14px 1fr;column-gap:12px;margin-top:14px}
.route__rail{display:flex;flex-direction:column;align-items:center;padding:5px 0}
.route__dot{width:12px;height:12px;border-radius:50%;flex:none}
.route__dot--o{background:var(--dot-o)}
.route__dot--d{background:var(--dot-d);border-radius:3px}
.route__line{flex:1;width:2px;background:var(--divider);margin:3px 0;min-height:22px}
.route__txt{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0}
.route__pt{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.route__stops{font-size:13px;color:var(--text-2)}
.t-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--divider)}
.t-price{font-size:18px;font-weight:700}
.t-price small{font-size:13px;font-weight:500;color:var(--text-2)}
.chip{border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;background:var(--muted);color:var(--text-2);border:1px solid var(--divider)}
.chip--full{background:var(--danger-bg);color:var(--danger);border-color:transparent}
/* Steps */
.prog{display:flex;gap:6px}
.prog span{flex:1;height:5px;border-radius:3px;background:var(--divider)}
.prog span.is-on{background:var(--primary)}
.h{margin:0 0 12px;font-size:15px;font-weight:700}
.label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin:0 0 6px}
.field{margin-bottom:14px;min-width:0}
.field:last-child{margin-bottom:0}
.input{display:block;width:100%;min-height:48px;padding:0 14px;border:1px solid var(--divider);border-radius:14px;background:var(--muted);color:var(--text);font:inherit;font-size:16px;color-scheme:light dark}
.input:focus{outline:2px solid var(--primary);outline-offset:-1px}
textarea.input{padding:12px 14px;min-height:88px;resize:vertical}
.sug{display:none;margin-top:4px;border:1px solid var(--divider);border-radius:14px;overflow:hidden;background:var(--card)}
.sug.is-open{display:block}
.sug__item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--divider);background:transparent;color:var(--text);font:inherit;font-size:14.5px;padding:11px 14px;cursor:pointer}
.sug__item:last-child{border-bottom:0}
.sug__item small{display:block;color:var(--text-2);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;border:1px solid var(--divider);border-radius:14px;overflow:hidden;background:var(--muted)}
.stepper button{width:48px;height:48px;border:0;background:transparent;color:var(--primary);font-size:22px;font-weight:600;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper b{min-width:36px;text-align:center;font-size:17px}
/* Verify screen */
.vcode{margin:14px 0 4px;padding:16px 8px 16px calc(8px + .28em);text-align:center;border-radius:14px;background:var(--chip);color:var(--chip-text);font:700 34px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.28em;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.vstack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.vstack .btn{flex:none;width:100%;text-decoration:none}
.btn.btn--line{background:transparent;color:var(--text);border:1px solid var(--divider)}
.btn.btn--line:hover{background:var(--muted)}
.btn.btn--link{background:transparent;color:var(--primary);min-height:44px;font-size:15px;text-decoration:underline!important}
.btn.btn--link:hover{background:transparent;color:var(--text)}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 0;font-size:14px;color:var(--text-2);line-height:1.4}
.spin{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--divider);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.vsteps{margin:12px 0 0;padding-left:20px;text-align:left;font-size:14.5px;line-height:1.5;color:var(--text-2)}
.hint{margin:8px 0 0;font-size:13px;color:var(--text-2);line-height:1.4}
.legal-note{margin:12px 0 0;text-align:center;font-size:12.5px;line-height:1.4;color:var(--text-2)}
.legal-note a{color:var(--text-2);text-decoration:underline;display:inline-block;padding:10px 0;margin:-10px 0}
.err{margin:10px 0 0;font-size:13.5px;color:var(--danger);line-height:1.4}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;min-height:50px;border-radius:14px;border:0;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:var(--cta);color:var(--cta-text)}
.btn:hover{background:var(--cta-hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn--ghost{flex:0 0 96px;background:transparent;color:var(--text);border:1px solid var(--divider)}
.btn--ghost:hover{background:var(--muted)}
.notice{border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.4;background:var(--danger-bg);color:var(--danger);font-weight:600}
/* States */
.state{text-align:center;padding:36px 20px}
.state__ic{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--chip);color:var(--chip-text)}
.state__ic svg{width:28px;height:28px}
.state h2{margin:0 0 8px;font-size:20px}
.state p{margin:0;color:var(--text-2);font-size:14.5px;line-height:1.45}
.state .btns{justify-content:center}
.state .btn{flex:0 1 auto;padding:0 22px}
.sum{margin:16px 0 0;padding:0;list-style:none;text-align:left;border-top:1px solid var(--divider)}
.sum li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--divider);font-size:14.5px}
.sum li span{color:var(--text-2);flex:none}
.sum li b{text-align:right;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);overflow-y:auto}
.modal__box{width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:var(--card);color:var(--text);border:1px solid var(--divider);border-radius:16px;padding:20px 16px 16px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.modal__box h2{margin:0 0 6px;font-size:20px}
.modal__box p{margin:0;color:var(--text-2);font-size:14.5px;line-height:1.45}
.skel{height:150px;border-radius:16px;background:var(--card);border:1px solid var(--divider)}
.skel + .skel{height:220px}
</style>
</head>
<body>
<div class="bar"><div class="bar__in"><span class="brand"><img src="/logo.png" alt=""></span><h1>Join a ride</h1></div></div>
<div class="wrap" id="root"><div class="skel"></div><div class="skel"></div></div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  if (qs.get('mock') === '1') { document.write('<script src="/join-mock.js"><\/script>'); }
})();
</script>
<script src="/js/supabase-js-2.117.2.min.js"></script>
<script src="/js/pf-avatar.js"></script>
<script>
(function () {
'use strict';

/* ---------- Supabase (public anon key: RPCs + public places table only) ---------- */
var SUPABASE_URL = 'https://omussxfyrztjahbdrrpi.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tdXNzeGZ5cnp0amFoYmRycnBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MjI1NjAsImV4cCI6MjA5NTk5ODU2MH0.ySigym7uOaFIQm01nErPfn4kE6j4MOVKoNntt_Mosak';
var noopStorage = { getItem: function () { return null; }, setItem: function () {}, removeItem: function () {} };
var db;
try {
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { storage: noopStorage, persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
} catch (e) { console.warn('Supabase failed to init:', e); }

var MAPBOX_TOKEN = 'pk.eyJ1IjoicGF0aHktY2EiLCJhIjoiY211aTZwMXRwMGQ4MjM0b2x4emxtMW9zOSJ9.w2VX7kd0rZniB4GnbLryGg';

/* ---------- Passenger home hook ----------
   First-time passengers do not type a name or number: trip_join_start makes a claim with a
   6-char code, the passenger sends "BOOK <CODE>" to our WhatsApp bot (n8n calls the
   service-role trip_join_verify), and trip_join_claim_status hands back the per-device
   passenger_token once verified. The passenger home lives at PASSENGER_HOME_URL + token
   (+ ?b=<booking id>). The token is kept in localStorage; a device that has one books
   directly through trip_join (the server rejects it with verification_required if the token
   is stale, and we fall back to the first-time flow). Without a token in the response the
   temporary "Seat confirmed" screen below is the fallback. */
var PASSENGER_HOME_URL = '/p/';
var TOKEN_KEY = 'pf_passenger_token';
var BOOKING_KEY = 'pf_passenger_booking';
var BOT_WA = '916356600421'; /* bot number: only ever used inside the wa.me link, never rendered */
var POLL_MS = 2500;

var STATE = {
  isMock: qs('mock') === '1', code: null, trip: null, busy: false, error: '', view: 'loading',
  pickup: null, dropoff: null, pickupTxt: '', dropoffTxt: '', seats: 1, note: '',
  returning: false, claim: null, copied: false
};
function qs(k) { try { return new URLSearchParams(location.search).get(k); } catch (e) { return null; } }

var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
var root = document.getElementById('root');

/* ---------- Storage (always guarded) ---------- */
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function savedToken() {
  if (STATE.isMock) return qs('returning') === '1' ? 'mock' : null;
  var t = lsGet(TOKEN_KEY);
  return (typeof t === 'string' && t) ? t : null;
}

/* ---------- API ---------- */
function getCode() {
  var m = location.pathname.match(/\/j\/([^/]+)/);
  if (m) return decodeURIComponent(m[1]);
  var c = qs('code');
  if (c) return c;
  return STATE.isMock ? 'DEMO42' : null;
}
function apiGet(code) {
  if (STATE.isMock) return window.PF_JOIN_MOCK.get(code);
  return db.rpc('trip_join_get', { p_code: code }).then(function (res) { if (res.error) throw res.error; return res.data; });
}
function apiJoin(a) {
  if (STATE.isMock) return window.PF_JOIN_MOCK.join(a);
  return db.rpc('trip_join', a).then(function (res) { if (res.error) throw res.error; return res.data; });
}
function apiStart(a) {
  if (STATE.isMock) return window.PF_JOIN_MOCK.start(a);
  return db.rpc('trip_join_start', a).then(function (res) { if (res.error) throw res.error; return res.data; });
}
function apiClaimStatus(id) {
  if (STATE.isMock) return window.PF_JOIN_MOCK.claimStatus(id);
  return db.rpc('trip_join_claim_status', { p_claim_id: id }).then(function (res) { if (res.error) throw res.error; return res.data; });
}

/* ---------- Places autocomplete (places table + Mapbox, as on the manage page) ---------- */
var AC = { timers: {}, seq: {}, rows: {}, session: {} };
function norm(x) { return String(x || '').toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ').trim(); }
function uuid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(16).slice(2)); }
function placesQuery(q) {
  if (STATE.isMock) return window.PF_JOIN_MOCK.places(q);
  if (!db) return Promise.resolve([]);
  return Promise.resolve(db.from('places').select('name,province,lat,lng').like('norm_key', norm(q) + '%').gte('popularity', 20).order('popularity', { ascending: false }).limit(4))
    .then(function (res) {
      return (res.data || []).map(function (p) { return { name: p.name, sub: p.province, label: p.name + ', ' + p.province + ', Canada', lat: p.lat, lng: p.lng }; });
    }).catch(function () { return []; });
}
function mapboxSuggest(q, tok) {
  if (STATE.isMock) return Promise.resolve([]);
  var p = new URLSearchParams();
  p.set('q', q); p.set('access_token', MAPBOX_TOKEN); p.set('session_token', tok);
  p.set('country', 'ca'); p.set('language', 'en'); p.set('limit', '6');
  p.set('types', 'poi,address,place,locality,neighborhood,street'); p.set('proximity', 'ip');
  return fetch('https://api.mapbox.com/search/searchbox/v1/suggest?' + p.toString())
    .then(function (r) { return r.ok ? r.json() : { suggestions: [] }; })
    .then(function (j) {
      return (j.suggestions || []).map(function (x) {
        var sub = x.full_address || x.place_formatted;
        return { name: x.name, sub: sub, label: sub ? (x.name + ', ' + sub) : x.name, mapbox_id: x.mapbox_id };
      }).filter(function (r) { return r.name && r.mapbox_id; });
    }).catch(function () { return []; });
}
function mapboxRetrieve(id, tok) {
  var p = new URLSearchParams();
  p.set('access_token', MAPBOX_TOKEN); p.set('session_token', tok);
  return fetch('https://api.mapbox.com/search/searchbox/v1/retrieve/' + encodeURIComponent(id) + '?' + p.toString())
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      var f = j && j.features && j.features[0]; if (!f) return null;
      var pr = f.properties || {}, c = (f.geometry && f.geometry.coordinates) || [];
      if (c[0] == null || c[1] == null) return null;
      var pt = pr.place_formatted || pr.full_address;
      return { label: pt ? (pr.name + ', ' + pt) : pr.name, lng: c[0], lat: c[1] };
    }).catch(function () { return null; });
}
function acSearch(key, q) {
  var seq = (AC.seq[key] = (AC.seq[key] || 0) + 1);
  var tok = AC.session[key] || (AC.session[key] = uuid());
  Promise.all([placesQuery(q), mapboxSuggest(q, tok)]).then(function (r) {
    var list = document.getElementById('sug-' + key);
    if (seq !== AC.seq[key] || !list) return;
    var seen = {}, rows = [];
    r[0].concat(r[1]).forEach(function (x) { var k = norm(x.name); if (seen[k] || rows.length >= 7) return; seen[k] = true; rows.push(x); });
    AC.rows[key] = rows;
    list.innerHTML = rows.map(function (x, i) { return '<button type="button" class="sug__item" data-i="' + i + '">' + esc(x.name) + (x.sub ? '<small>' + esc(x.sub) + '</small>' : '') + '</button>'; }).join('');
    list.classList.toggle('is-open', rows.length > 0);
  });
}
function acPick(key, x) {
  var input = document.getElementById('in-' + key), list = document.getElementById('sug-' + key);
  list.classList.remove('is-open'); list.innerHTML = '';
  var done = function (pt) {
    if (!pt) { setErr("Couldn't load that place. Try another."); return; }
    STATE[key] = pt; STATE[key + 'Txt'] = pt.label; input.value = pt.label; setErr('');
  };
  if (x.mapbox_id) {
    input.value = x.label; STATE[key + 'Txt'] = x.label;
    var tok = AC.session[key]; AC.session[key] = null;
    mapboxRetrieve(x.mapbox_id, tok).then(done);
  } else done({ label: x.label, lat: x.lat, lng: x.lng });
}
function acWire(key) {
  var input = document.getElementById('in-' + key), list = document.getElementById('sug-' + key);
  if (!input || !list) return;
  input.addEventListener('input', function () {
    STATE[key + 'Txt'] = input.value;
    if (STATE[key] && input.value !== STATE[key].label) STATE[key] = null;
    clearTimeout(AC.timers[key]);
    var q = input.value.trim();
    if (q.length < 3) { AC.seq[key] = (AC.seq[key] || 0) + 1; list.classList.remove('is-open'); list.innerHTML = ''; return; }
    AC.timers[key] = setTimeout(function () { acSearch(key, q); }, 300);
  });
  /* pointerdown so one tap selects before blur closes the keyboard */
  list.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.sug__item'); if (!b) return;
    e.preventDefault();
    var x = (AC.rows[key] || [])[Number(b.getAttribute('data-i'))]; if (x) acPick(key, x);
  });
}

/* ---------- Rendering ---------- */
function setErr(msg) {
  STATE.error = msg;
  var el = document.getElementById('err');
  if (el) { el.textContent = msg; el.hidden = !msg; }
}
function seatsLeft() { return STATE.trip ? Math.max(0, Number(STATE.trip.seats_left) || 0) : 0; }
function isFull() { return !!STATE.trip && (STATE.trip.status === 'full' || seatsLeft() <= 0); }
function money(n) { var v = Number(n); return (v % 1 === 0) ? String(v) : v.toFixed(2); }

function tripCard(t) {
  var first = String(t.driver_first_name || 'Driver');
  var stops = Number(t.stops_count) || 0;
  var joined = Number(t.joined_count) || 0;
  return '<section class="card" aria-label="Trip details">' +
    '<div class="t-head"><div class="avatar" aria-hidden="true">' + pfAvatarHtml(t.driver_id, 44, first.charAt(0).toUpperCase()) + '</div>' +
    '<div class="t-who">' + esc(first) + '</div>' +
    (/^https:\/\//i.test(String(t.message_url || '')) ? '<a class="t-msg" href="' + esc(t.message_url) + '" target="_blank" rel="noopener" aria-label="Message driver">' + IC_MSG + '</a>' : '') + '</div>' +
    (t.schedule_text ? '<p class="t-when">' + esc(t.schedule_text) + '</p>' : '') +
    '<div class="route"><div class="route__rail"><span class="route__dot route__dot--o"></span><span class="route__line"></span><span class="route__dot route__dot--d"></span></div>' +
    '<div class="route__txt"><div><span class="route__lbl">Origin</span><div class="route__pt">' + esc(t.origin_label) + '</div></div>' +
    (stops > 0 ? '<div class="route__stops">+ ' + stops + (stops === 1 ? ' stop' : ' stops') + '</div>' : '') +
    '<div><span class="route__lbl">Destination</span><div class="route__pt">' + esc(t.dest_label) + '</div></div></div></div>' +
    '<div class="t-foot"><div class="t-price">' + (t.price_per_seat != null ? '$' + esc(money(t.price_per_seat)) + ' <small>/ seat</small>' : '<small>Price set by driver</small>') + '</div>' +
    '<span class="chip' + (isFull() ? ' chip--full' : '') + '">' + (isFull() ? 'Trip full' : joined + ' joined') + '</span></div></section>';
}
function stateScreen(icon, title, text) {
  return '<div class="card state"><div class="state__ic">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
    '<div class="btns"><a class="btn" href="/explore" style="text-decoration:none">Explore rides</a></div></div>';
}
var IC_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>';
var IC_MSG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
var IC_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function stepper() {
  var max = seatsLeft();
  return '<div class="row"><span class="label" style="margin:0">Seats</span><div class="stepper">' +
    '<button type="button" data-a="dec" aria-label="Fewer seats"' + (STATE.seats <= 1 ? ' disabled' : '') + '>−</button>' +
    '<b id="seatsVal" aria-live="polite">' + STATE.seats + '</b>' +
    '<button type="button" data-a="inc" aria-label="More seats"' + (STATE.seats >= max ? ' disabled' : '') + '>+</button></div></div>' +
    '<p class="hint">' + max + (max === 1 ? ' seat' : ' seats') + ' left on this trip.</p>';
}
function stepHtml() {
  var last = '<button type="button" class="btn" data-a="confirm" id="mainBtn">Book ride</button>';
  return '<div class="card"><h3 class="h">Where</h3>' +
    '<div class="field"><label class="label" for="in-pickup">Pickup</label><input class="input" id="in-pickup" type="text" autocomplete="off" placeholder="Where should the driver pick you up?" value="' + esc(STATE.pickupTxt) + '"><div class="sug" id="sug-pickup"></div></div>' +
    '<div class="field"><label class="label" for="in-dropoff">Dropoff</label><input class="input" id="in-dropoff" type="text" autocomplete="off" placeholder="Where are you getting off?" value="' + esc(STATE.dropoffTxt) + '"><div class="sug" id="sug-dropoff"></div></div>' +
    '<div class="field">' + stepper() + '</div>' +
    '<div class="field"><label class="label" for="in-note">Note for the driver (optional)</label><textarea class="input" id="in-note" maxlength="300" placeholder="Landmark, luggage, anything helpful">' + esc(STATE.note) + '</textarea></div>' +
    (STATE.returning ? '' : '<p class="hint">Next you’ll confirm on WhatsApp. No typing your name or number.</p>') +
    '<p class="err" id="err" role="alert"' + (STATE.error ? '' : ' hidden') + '>' + esc(STATE.error) + '</p>' +
    '<div class="btns">' + last + '</div>' +
    '<p class="legal-note">By booking you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p></div>';
}
function waUrl(code) { return 'https://wa.me/' + BOT_WA + '?text=' + encodeURIComponent('BOOK ' + code); }
function verifyHtml() {
  var c = STATE.claim || {};
  return '<div class="card state"><h2>Confirm on WhatsApp</h2>' +
    '<p>Send this code to our WhatsApp to lock in your seat. Just tap the button and hit send.</p>' +
    '<div class="vcode" id="vcode">' + esc(c.code) + '</div>' +
    '<div class="vstack">' +
    '<a class="btn" id="waBtn" href="' + esc(waUrl(c.code)) + '" target="_blank" rel="noopener">Send code on WhatsApp</a>' +
    '<button type="button" class="btn btn--line" data-a="copy" id="copyBtn">' + (STATE.copied ? 'Code copied' : 'Copy code') + '</button></div>' +
    '<p class="wait" role="status"><span class="spin" aria-hidden="true"></span><span>Waiting for WhatsApp… code expires in <b id="cd">' + fmtLeft() + '</b></span></p>' +
    '<div class="vstack" style="margin-top:6px"><button type="button" class="btn btn--link" data-a="startover">Start over</button></div></div>';
}
function fmtLeft() {
  var s = Math.max(0, Math.round(((STATE.claim ? STATE.claim.expires : 0) - Date.now()) / 1000));
  return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
}
function render() {
  var v = STATE.view;
  if (v === 'loading') { root.innerHTML = '<div class="skel"></div><div class="skel"></div>'; return; }
  if (v === 'invalid') { root.innerHTML = stateScreen(IC_WARN, 'Link not found', 'This ride link isn’t valid. Check the link with your driver.'); return; }
  if (v === 'expired') { root.innerHTML = stateScreen(IC_WARN, 'This ride has ended', 'This trip is no longer open for new passengers.'); return; }
  if (v === 'error') {
    root.innerHTML = '<div class="card state"><div class="state__ic">' + IC_WARN + '</div><h2>Something went wrong</h2><p>We couldn’t load this ride. Check your connection and try again.</p>' +
      '<div class="btns"><button type="button" class="btn" data-a="retry">Try again</button></div></div>';
    return;
  }
  if (v === 'done') { root.innerHTML = tripCard(STATE.trip) + confirmedHtml(); return; }
  if (v === 'verify') { root.innerHTML = tripCard(STATE.trip) + verifyHtml(); return; }
  if (v === 'claimfull') {
    root.innerHTML = tripCard(STATE.trip) + stateScreen(IC_WARN, 'This ride filled up', 'Someone took the last seat before your code came through. Other rides may still have room.');
    return;
  }
  if (v === 'claimexpired') {
    root.innerHTML = tripCard(STATE.trip) + '<div class="card state"><div class="state__ic">' + IC_WARN + '</div><h2>Code expired</h2>' +
      '<p>No worries, that code timed out. Grab a new one and send it on WhatsApp.</p>' +
      '<p class="err" id="err" role="alert" hidden></p>' +
      '<div class="vstack"><button type="button" class="btn" data-a="newcode" id="mainBtn">Get a new code</button>' +
      '<button type="button" class="btn btn--link" data-a="startover">Start over</button></div></div>';
    return;
  }
  if (isFull()) {
    root.innerHTML = tripCard(STATE.trip) +
      '<div class="notice" role="status">This trip is full. All seats have been taken.</div>' +
      '<div class="btns" style="margin:0"><button type="button" class="btn" disabled>Trip full</button></div>';
    return;
  }
  root.innerHTML = tripCard(STATE.trip) + stepHtml();
  acWire('pickup'); acWire('dropoff');
  syncBusy();
}
function syncBusy() {
  var b = document.getElementById('mainBtn'); if (!b) return;
  b.disabled = STATE.busy;
  b.textContent = STATE.busy ? (STATE.returning ? 'Booking…' : 'One moment…') : (STATE.view === 'claimexpired' ? 'Get a new code' : 'Book ride');
}
function confirmedHtml() {
  var b = STATE.booking || {};
  return '<div class="card state"><div class="state__ic">' + IC_OK + '</div><h2>Seat confirmed</h2>' +
    '<p>You’re booked. We’ll message you on WhatsApp as soon as your driver is assigned.</p>' +
    '<ul class="sum"><li><span>Pickup</span><b>' + esc(b.pickup_label) + '</b></li><li><span>Dropoff</span><b>' + esc(b.dropoff_label) + '</b></li>' +
    '<li><span>Seats</span><b>' + esc(b.seats) + '</b></li><li><span>Driver</span><b>' + esc(b.driver_first_name) + '</b></li></ul></div>';
}

/* ---------- Actions ---------- */
function readNote() {
  var e = document.getElementById('in-note'); if (e) STATE.note = e.value.trim();
}
function validStep1() {
  if (!STATE.pickup) { setErr('Pick your pickup place from the suggestions.'); return false; }
  if (!STATE.dropoff) { setErr('Pick your dropoff place from the suggestions.'); return false; }
  setErr(''); return true;
}
function tripArgs() {
  return { p_code: STATE.code, p_pickup: STATE.pickup, p_dropoff: STATE.dropoff, p_seats: STATE.seats, p_note: STATE.note || null };
}
function finishBooking(b, token) {
  var t = STATE.trip || {};
  goToPassengerHome({
    id: b.id, code: STATE.code, seats: b.seats, status: b.status || 'confirmed',
    pickup_label: b.pickup_label || STATE.pickup.label, dropoff_label: b.dropoff_label || STATE.dropoff.label,
    driver_first_name: t.driver_first_name, origin_label: t.origin_label, dest_label: t.dest_label,
    title: t.title || null, schedule_text: t.schedule_text || null, price_per_seat: t.price_per_seat,
    booked_at: new Date().toISOString()
  }, token);
}
/* Book ride: validate, then ask for confirmation in a popup. */
var modalEl = null, modalPrev = null;
function closeModal() {
  if (!modalEl) return;
  document.removeEventListener('keydown', modalKey, true);
  modalEl.parentNode.removeChild(modalEl); modalEl = null;
  document.body.style.overflow = '';
  if (modalPrev && modalPrev.focus && document.contains(modalPrev)) { try { modalPrev.focus(); } catch (e) {} }
  modalPrev = null;
}
function modalKey(e) {
  if (!modalEl) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key === 'Tab') {
    var f = modalEl.querySelectorAll('button'), first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!modalEl.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
}
function openModal() {
  if (modalEl) return;
  var t = STATE.trip || {};
  modalPrev = document.activeElement;
  modalEl = document.createElement('div');
  modalEl.className = 'modal';
  modalEl.innerHTML = '<div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="mdTitle" aria-describedby="mdText">' +
    '<h2 id="mdTitle">Book this ride?</h2><p id="mdText">Your ride will be booked.</p>' +
    '<ul class="sum"><li><span>Route</span><b>' + esc(STATE.pickup.label) + ' → ' + esc(STATE.dropoff.label) + '</b></li>' +
    '<li><span>Seats</span><b>' + esc(STATE.seats) + '</b></li>' +
    (t.schedule_text ? '<li><span>When</span><b>' + esc(t.schedule_text) + '</b></li>' : '') + '</ul>' +
    '<div class="btns"><button type="button" class="btn btn--line" data-m="cancel">Cancel</button>' +
    '<button type="button" class="btn" data-m="book" id="mdBook">Book</button></div></div>';
  modalEl.addEventListener('click', function (e) {
    if (e.target === modalEl) { closeModal(); return; }
    var m = e.target.closest('[data-m]'); if (!m) return;
    if (m.getAttribute('data-m') === 'cancel') closeModal();
    else if (m.getAttribute('data-m') === 'book') { if (STATE.busy) return; closeModal(); doBook(); }
  });
  document.body.appendChild(modalEl);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', modalKey, true);
  document.getElementById('mdBook').focus();
}
function confirm() {
  if (STATE.busy || modalEl) return;
  readNote();
  if (!validStep1()) return;
  openModal();
}
function doBook() {
  if (STATE.busy) return;
  if (!STATE.returning) { startClaim(); return; }
  STATE.busy = true; setErr(''); syncBusy();
  /* returning device: name + number come from the saved passenger on the server */
  var joinArgs = tripArgs();
  joinArgs.p_name = null; joinArgs.p_whatsapp = null; joinArgs.p_passenger_token = savedToken();
  apiJoin(joinArgs).then(function (res) {
    STATE.busy = false;
    if (res && res.error === 'verification_required') {
      /* saved token is stale/unknown: forget it and drop to the first-time flow */
      lsDel(TOKEN_KEY); STATE.returning = false; render(); startClaim(); return;
    }
    if (res && res.error) { handleJoinError(res.error); return; }
    if (!res || !res.booking) { handleJoinError('unknown'); return; }
    if (res.trip) STATE.trip = res.trip;
    finishBooking(res.booking, res.passenger_token);
  }).catch(function () {
    STATE.busy = false;
    setErr('We couldn’t book your seat. Check your connection and try again.');
    syncBusy();
  });
}

/* ---------- First-time flow: claim -> WhatsApp code -> poll ---------- */
var POLL = { timer: null, tick: null, on: false, inflight: false };
function stopVerify() { POLL.on = false; POLL.inflight = false; clearTimeout(POLL.timer); clearInterval(POLL.tick); }
function schedulePoll(ms) { clearTimeout(POLL.timer); if (POLL.on) POLL.timer = setTimeout(pollOnce, ms); }
function startVerify() {
  stopVerify(); POLL.on = true;
  POLL.tick = setInterval(function () { var el = document.getElementById('cd'); if (el) el.textContent = fmtLeft(); }, 1000);
  schedulePoll(POLL_MS);
}
/* Paused while the tab is hidden; visibilitychange resumes it. */
function pollOnce() {
  if (!POLL.on || POLL.inflight || !STATE.claim) return;
  if (document.hidden) return;
  var id = STATE.claim.id;
  POLL.inflight = true;
  apiClaimStatus(id).then(function (res) {
    POLL.inflight = false;
    if (!POLL.on || !STATE.claim || STATE.claim.id !== id) return;
    handleClaimStatus(res);
  }).catch(function () { POLL.inflight = false; schedulePoll(POLL_MS); });
}
document.addEventListener('visibilitychange', function () { if (POLL.on && !document.hidden) pollOnce(); });
function handleClaimStatus(res) {
  var st = res && res.status;
  if (st === 'verified') {
    stopVerify();
    if (res.trip) STATE.trip = res.trip;
    finishBooking({ id: res.booking_id, seats: STATE.seats }, res.passenger_token);
    return;
  }
  if (st === 'full') { stopVerify(); if (res.trip) STATE.trip = res.trip; STATE.view = 'claimfull'; render(); window.scrollTo(0, 0); return; }
  if (st === 'expired' || (st === 'pending' && Date.now() > STATE.claim.expires + 3000)) {
    stopVerify(); STATE.view = 'claimexpired'; render(); window.scrollTo(0, 0); return;
  }
  if (st === 'failed') { stopVerify(); STATE.view = 'trip'; render(); setErr('We lost track of that code. Please try again.'); return; }
  schedulePoll(POLL_MS);
}
function startClaim() {
  STATE.busy = true; setErr(''); syncBusy();
  apiStart(tripArgs()).then(function (res) {
    STATE.busy = false;
    if (res && res.error) { if (STATE.view === 'claimexpired') { STATE.view = 'trip'; render(); } handleJoinError(res.error); return; }
    if (!res || !res.claim_id || !res.verify_code) { handleJoinError('unknown'); return; }
    if (res.trip) STATE.trip = res.trip;
    STATE.claim = { id: res.claim_id, code: res.verify_code, expires: Date.parse(res.expires_at) || (Date.now() + 30 * 60000) };
    STATE.copied = false; STATE.view = 'verify'; render(); window.scrollTo(0, 0); startVerify();
  }).catch(function () {
    STATE.busy = false;
    setErr('We couldn’t get your code. Check your connection and try again.');
    syncBusy();
  });
}
function copyCode() {
  var c = STATE.claim && STATE.claim.code; if (!c) return;
  var done = function () {
    STATE.copied = true;
    var b = document.getElementById('copyBtn'); if (b) b.textContent = 'Code copied';
    setTimeout(function () { STATE.copied = false; var b2 = document.getElementById('copyBtn'); if (b2) b2.textContent = 'Copy code'; }, 2000);
  };
  var fallback = function () {
    try {
      var el = document.getElementById('vcode'), r = document.createRange(), sel = window.getSelection();
      r.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(r);
      if (document.execCommand('copy')) done();
    } catch (e) {}
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(c).then(done, fallback); return; } } catch (e) {}
  fallback();
}
function handleJoinError(code) {
  if (code === 'full') {
    /* refresh so the page shows the real seat count / full state */
    apiGet(STATE.code).then(function (r) { if (r && r.trip) STATE.trip = r.trip; render(); if (!isFull()) setErr('Someone just took a seat. Try fewer seats.'); }).catch(function () { setErr('Not enough seats left.'); syncBusy(); });
    return;
  }
  if (code === 'invalid_code') { STATE.view = 'invalid'; render(); return; }
  if (code === 'expired') { STATE.view = 'expired'; render(); return; }
  if (code === 'invalid_input') { setErr('Please check your details and try again.'); syncBusy(); return; }
  if (code === 'busy') { setErr('We’re a bit busy right now. Please try again in a minute.'); syncBusy(); return; }
  setErr('We couldn’t book your seat. Please try again.'); syncBusy();
}

/* Single hook for what happens after a booking succeeds. */
function goToPassengerHome(booking, token) {
  lsSet(BOOKING_KEY, booking); /* summary (no phone number) for the passenger home page */
  if (typeof token === 'string' && token) {
    if (!STATE.isMock) { lsSet(TOKEN_KEY, token); try { localStorage.setItem('pf_profile_token', token); } catch (e) {} } /* Explore's Message reads pf_profile_token */
    location.href = PASSENGER_HOME_URL + encodeURIComponent(token) + (STATE.isMock ? '?mock=1' : '?b=' + encodeURIComponent(booking.id));
    return;
  }
  /* No token came back: keep the temporary "Seat confirmed" screen as the fallback. */
  STATE.booking = booking; STATE.view = 'done'; render();
  window.scrollTo(0, 0);
}

root.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a');
  if (a === 'inc' && STATE.seats < seatsLeft()) { readNote(); STATE.seats++; render(); }
  else if (a === 'dec' && STATE.seats > 1) { readNote(); STATE.seats--; render(); }
  else if (a === 'confirm') confirm();
  else if (a === 'copy') copyCode();
  else if (a === 'newcode') { if (!STATE.busy) startClaim(); }
  else if (a === 'startover') { stopVerify(); STATE.claim = null; STATE.busy = false; STATE.view = 'trip'; setErr(''); render(); window.scrollTo(0, 0); }
  else if (a === 'retry') load();
});

function load() {
  STATE.view = 'loading'; render();
  STATE.code = getCode();
  if (!STATE.code) { STATE.view = 'invalid'; render(); return; }
  apiGet(STATE.code).then(function (res) {
    if (!res || res.error === 'invalid_code') { STATE.view = 'invalid'; render(); return; }
    if (res.error === 'expired') { STATE.view = 'expired'; render(); return; }
    if (res.error || !res.trip) { STATE.view = 'error'; render(); return; }
    STATE.trip = res.trip; STATE.view = 'trip';
    STATE.seats = Math.min(Math.max(1, STATE.seats), Math.max(1, seatsLeft()));
    render();
  }).catch(function () { STATE.view = 'error'; render(); });
}

STATE.returning = !!savedToken();
load();
})();
</script>
</body>
</html>
