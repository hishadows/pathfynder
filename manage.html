<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#008069">
<link rel="icon" type="image/png" href="/logo.png">
<title>Manage ride · Pathfynder</title>
<script>try{var __t=localStorage.getItem("pf_theme");if(__t==="light"||__t==="dark")document.documentElement.setAttribute("data-theme",__t);}catch(e){}</script>
<style>
:root{
  --header:#008069; --header-text:#FFFFFF; --header-sub:rgba(255,255,255,.82);
  --primary:#008069; --cta:#008069; --cta-text:#FFFFFF; --cta-hover:#006D5B;
  --bg:#F0F2F5; --card:#FFFFFF; --muted-card:#F7F8FA;
  --text:#111B21; --text-2:#667781; --divider:#E9EDEF;
  --chip-soft:#D9FDD3; --chip-soft-text:#006D5B; --danger:#D93025;
  --hero-bg:#075E54; --hero-text:#FFFFFF; --hero-chip:rgba(255,255,255,.12); --hero-fill:#25D366;
  --overlay:rgba(11,20,26,.42); --shadow:0 -1px 4px rgba(11,20,26,.08);
  --sel-bg:#E3F1EA; --sel-border:#075E54; --pax-tint:rgba(0,0,0,.035);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --header:#202C33; --header-text:#E9EDEF; --header-sub:#8696A0;
    --primary:#00A884; --cta:#005C4B; --cta-text:#E9EDEF; --cta-hover:#006D5B;
    --bg:#0B141A; --card:#202C33; --muted-card:#182229;
    --text:#E9EDEF; --text-2:#8696A0; --divider:#2A3942;
    --chip-soft:#0A332C; --chip-soft-text:#25D366; --danger:#F15C6D;
    --hero-bg:#075E54; --hero-text:#FFFFFF; --hero-chip:rgba(255,255,255,.12); --hero-fill:#25D366;
    --overlay:rgba(0,0,0,.62); --shadow:0 -1px 4px rgba(0,0,0,.4);
    --sel-bg:#0A332C; --sel-border:#00A884; --pax-tint:rgba(255,255,255,.045);
  }
}
:root[data-theme="dark"]{
  --header:#202C33; --header-text:#E9EDEF; --header-sub:#8696A0;
  --primary:#00A884; --cta:#005C4B; --cta-text:#E9EDEF; --cta-hover:#006D5B;
  --bg:#0B141A; --card:#202C33; --muted-card:#182229;
  --text:#E9EDEF; --text-2:#8696A0; --divider:#2A3942;
  --chip-soft:#0A332C; --chip-soft-text:#25D366; --danger:#F15C6D;
  --hero-bg:#075E54; --hero-text:#FFFFFF; --hero-chip:rgba(255,255,255,.12); --hero-fill:#25D366;
  --overlay:rgba(0,0,0,.62); --shadow:0 -1px 4px rgba(0,0,0,.4);
  --sel-bg:#0A332C; --sel-border:#00A884; --pax-tint:rgba(255,255,255,.045);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit}
.app{min-height:100vh;max-width:100vw;overflow-x:clip;padding-bottom:24px}
.app.has-bar{padding-bottom:96px}

/* Header */
.app-bar{position:sticky;top:0;z-index:3;background:var(--header);color:var(--header-text)}
.app-bar__inner{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px}
.brand{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#FFFFFF;flex:none;overflow:hidden}
.brand img{width:22px;height:22px;object-fit:contain}
.app-bar__title{margin:0;font-size:18px;font-weight:600;line-height:1.2}
.app-bar__sub{margin:0;font-size:12.5px;color:var(--header-sub)}
.profile-btn{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.16);color:var(--header-text);display:grid;place-items:center;cursor:pointer}
.profile-btn svg{width:22px;height:22px}

/* Profile screen */
.pf-bar__inner{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 8px}
.pf-back{flex:none;width:44px;height:44px;border-radius:50%;border:0;padding:0;background:transparent;color:var(--header-text);display:grid;place-items:center;cursor:pointer}
.pf-back svg{width:24px;height:24px}
.pf-wrap{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.pf-card{background:var(--card);border:1px solid var(--divider);border-radius:14px;padding:14px 16px}
.pf-h{margin:0 0 10px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.pf-head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pf-avatar-wrap{position:relative;width:96px;height:96px}
.pf-avatar{width:96px;height:96px;border-radius:50%;background:var(--sel-border);color:#FFFFFF;display:grid;place-items:center;font-size:34px;font-weight:600;overflow:hidden}
.pf-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pf-cam{position:absolute;right:-2px;bottom:-2px;width:36px;height:36px;border-radius:50%;border:2px solid var(--card);background:var(--cta);color:var(--cta-text);display:grid;place-items:center;padding:0;cursor:pointer}
.pf-cam svg,.pf-pencil svg,.pf-lock svg,.pf-row-ic svg{width:18px;height:18px}
.pf-name{display:flex;align-items:center;gap:6px;justify-content:center;font-size:20px;font-weight:600;min-width:0}
.pf-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.pf-pencil{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--primary);display:grid;place-items:center;padding:0;cursor:pointer}
.pf-edit{display:flex;flex-direction:column;gap:8px;width:100%}
.pf-input{width:100%;min-height:44px;border:1px solid var(--divider);border-radius:10px;background:var(--muted-card);color:var(--text);font:inherit;font-size:16px;padding:0 12px}
.pf-edit__btns{display:flex;gap:8px}
.pf-edit__btns .btn{flex:1}
.pf-err{margin:0;font-size:13px;color:var(--danger)}
.pf-row{display:flex;align-items:center;gap:12px;min-height:48px;color:var(--text);text-decoration:none}
.pf-row__t{flex:1;min-width:0}
.pf-row__t b{display:block;font-size:15px;font-weight:600}
.pf-row__t span{display:block;font-size:13px;color:var(--text-2);margin-top:2px}
.pf-lock,.pf-row-ic{flex:none;color:var(--text-2);display:grid;place-items:center}
.pf-row-ic{color:var(--primary)}
.pf-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-stat{background:var(--muted-card);border:1px solid var(--divider);border-radius:12px;padding:12px}
.pf-stat b{display:block;font-size:20px;font-weight:700;color:var(--text)}
.pf-stat span{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px}
.pf-switch{flex:none;position:relative;width:52px;height:32px;border-radius:16px;border:0;padding:0;background:var(--divider);cursor:pointer;transition:background .15s}
.pf-switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.pf-switch[aria-checked="true"]{background:var(--primary)}
.pf-switch[aria-checked="true"]::after{transform:translateX(20px)}
.pf-switch:disabled{opacity:.5;cursor:default}
.pf-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--muted-card);border:1px solid var(--divider);border-radius:12px;padding:4px}
.pf-seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--text);font-size:14.5px;font-weight:600;cursor:pointer}
.pf-seg button[aria-pressed="true"]{background:var(--cta);color:var(--cta-text)}
.pf-skel{height:120px;border-radius:14px;background:var(--card);border:1px solid var(--divider)}

/* Date strip */
.date-strip{padding:12px 0 4px}
.date-strip__label{margin:0 16px 8px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.date-strip__row{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.date-strip__row::-webkit-scrollbar{display:none}
.date-pill{flex:none;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--divider);background:var(--card);color:var(--text);cursor:pointer;font:inherit}
.date-pill__top{font-size:15px;font-weight:700;line-height:1.25}
.date-pill__sub{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);line-height:1.3}
.date-pill__sub--date{text-transform:none;letter-spacing:0;font-size:12px}
.trip-chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.trip-chips::-webkit-scrollbar{display:none}
.trip-chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--divider);background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.trip-chip.is-selected{background:var(--sel-bg);border-color:var(--sel-border)}
.date-pill.is-selected{background:var(--sel-bg);border-color:var(--sel-border)}

/* Empty state */
.empty-day{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px}
.empty-day h2{margin:0 0 8px;font-size:19px}
.empty-day p{margin:0 0 20px;color:var(--text-2);font-size:14.5px;max-width:320px}
.empty-day__btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}

/* Skeleton */
.skel{padding:16px}
.skel__block{background:var(--divider);border-radius:16px;height:220px;margin-bottom:12px;animation:pulse 1.2s ease-in-out infinite}
.skel__line{background:var(--divider);border-radius:8px;height:70px;margin-bottom:8px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* Error page */
.error-page{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px}
.error-page h2{margin:0 0 8px;font-size:19px}
.error-page p{margin:0 0 20px;color:var(--text-2);font-size:14.5px;max-width:320px}

/* Buttons */
.btn{border:0;border-radius:12px;font-size:14.5px;font-weight:600;cursor:pointer;min-height:44px;padding:0 12px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn-cta{background:var(--cta);color:var(--cta-text);min-height:48px}
.btn-cta:hover:not(:disabled){background:var(--cta-hover)}
.btn .i{width:17px;height:17px;flex:none}
.btn-secondary{background:var(--muted-card);color:var(--text);border:1px solid var(--divider)}
.btn-danger{background:var(--danger);color:#FFFFFF}
.btn-secondary.btn-danger-text{color:var(--danger)}
.btn-full{width:100%}

/* Hero */
.hero-wrap{padding:12px 12px 0}
.hero-track{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;border-radius:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;transition:height .25s ease}
@media (prefers-reduced-motion:reduce){.hero-track{transition:none}}
.hero-track::-webkit-scrollbar{display:none}
.hero-slide{align-self:flex-start;box-sizing:border-box;flex:0 0 100%;scroll-snap-align:start;min-width:100%;background:var(--hero-bg);color:var(--hero-text);padding:14px;border-radius:16px}
.hero-dots{display:flex;justify-content:center;gap:6px;padding:12px 0 0;margin:0 0 -4px}
.hero-dot{width:7px;height:7px;border-radius:4px;background:var(--divider);border:0;padding:0;cursor:pointer}
.hero-dot.is-active{width:18px;background:var(--primary)}

/* Maps card */
.maps-card{display:flex;align-items:center;gap:12px;width:calc(100% - 24px);margin:4px 12px 0;padding:14px 16px;border:0;border-radius:16px;background:var(--hero-bg);color:var(--hero-text);text-align:left;font:inherit;cursor:pointer}
.maps-card__icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.maps-card__icon svg{width:22px;height:22px}
.maps-card__text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.maps-card__title{font-size:15px;font-weight:700}
.maps-card__sub{font-size:12.5px;opacity:.75}
.maps-card__btn{flex:none;display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:999px;background:#FFFFFF;color:#0B141A;font-size:14px;font-weight:600}

.hero-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hero-top__text{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero-pill{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--hero-chip)}

.hero-route{position:relative;padding-left:20px;margin-bottom:14px}
.hero-route::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;border-left:2px dotted rgba(255,255,255,.5)}
.hero-route__stop{position:relative;display:flex;align-items:center;gap:10px;min-height:30px}
.hero-route__dot{position:absolute;left:-20px;width:9px;height:9px;border:2px solid #FFFFFF;background:transparent;border-radius:50%}
.hero-route__dot--to{background:#FFFFFF;border-radius:2px;transform:rotate(45deg);width:8px;height:8px}
.hero-route__city{display:block;font-size:15.5px;font-weight:600}
.hero-route__sub{display:block;font-size:12px;color:rgba(255,255,255,.75)}

.hero-chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.hero-chip{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--hero-chip)}

.hero-panels{display:flex;flex-direction:column;gap:10px}
.hero-panel{background:var(--hero-chip);border-radius:12px;padding:10px 12px}
.hero-panel__label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.hero-panel__value{display:block;font-size:15px;font-weight:700}
.hero-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.hero-bar__fill{height:100%;background:var(--hero-fill);border-radius:4px}

.hero-slide__title{margin:0 0 12px;font-size:15px;font-weight:700}
.route-stops{display:flex;flex-direction:column}
.route-stop{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:14px}
.route-stop:last-child{padding-bottom:0}
.route-stop:not(:last-child)::before{content:"";position:absolute;left:5.5px;top:11px;bottom:-11px;width:3px;z-index:0;opacity:.45;background:repeating-linear-gradient(to bottom,var(--primary) 0 5px,transparent 5px 9px)}
.route-stop.is-trav:not(:last-child)::before,.route-stops--complete .route-stop:not(:last-child)::before{opacity:1;background:var(--primary)}
.route-stop__dot{width:14px;height:14px;flex:none;margin-top:4px;position:relative;z-index:1}
.route-stop__dot::after{content:"";position:absolute;inset:1px;border-radius:50%;box-sizing:border-box;background:var(--card);border:2.5px solid var(--primary)}
.route-stop__dot--start::after,.route-stop.is-done .route-stop__dot::after{background:var(--primary)}
.route-stop__dot--end::after{inset:0;background:var(--primary)}
.route-stop__dot--end::before{content:"";position:absolute;left:4.5px;top:4.5px;width:5px;height:5px;border-radius:50%;background:#fff;z-index:1}
.route-stop__text{min-width:0;display:flex;flex-direction:column}
.route-stop__label{font-size:14px;font-weight:600;color:var(--text);line-height:18px}
.route-stop__addr{font-size:12.5px;color:var(--text-2);line-height:17px}
.route-stop__addr b{font-weight:600}
.route-stop.is-done .route-stop__text{opacity:.55}
.hero-slide--route{background:var(--card);color:var(--text);border:1px solid var(--divider)}
.ns-hint{margin:8px 0 0;font-size:12.5px;color:var(--text-2);text-align:center}
.ns-btns .btn.is-off{opacity:.5;cursor:default;pointer-events:none}

/* Next stop slide */
.hero-slide--next{background:var(--card);color:var(--text);border:1px solid var(--divider)}
.ns-prog__row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;margin-bottom:6px}
.ns-prog__row strong{font-weight:700}
.ns-prog__row span{color:var(--text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ns-bar{position:relative;padding-top:16px;margin-bottom:14px}
.ns-segs{display:flex;gap:3px}
.ns-seg{flex:1;height:6px;border-radius:3px;background:var(--divider)}
.ns-seg.is-done{background:var(--primary)}
.ns-seg.is-current{background:var(--cta);animation:nsPulse 1.6s ease-in-out infinite}
.ns-car{position:absolute;top:0;width:20px;height:14px;transform:translateX(-50%);color:var(--primary);transition:left .5s ease}
.ns-car svg{display:block;width:20px;height:14px}
@keyframes nsPulse{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.ns-seg.is-current{animation:none}.ns-car{transition:none}}
.ns-pillrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.ns-pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:5px 10px;border-radius:999px;background:var(--chip-soft);color:var(--chip-soft-text)}
.ns-eta{font-size:13px;color:var(--text-2);font-weight:600;white-space:nowrap}
.ns-addr__label{display:block;font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.ns-addr{display:block;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.ns-addr__row{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.ns-addr__go{width:16px;height:16px;flex:none;margin-top:2px;margin-left:auto;color:var(--text-2)}
.ns-addr:active .ns-addr__text{text-decoration:underline}
.ns-addr__row>svg:first-child{width:20px;height:20px;flex:none;color:var(--primary);margin-top:0}
.ns-addr__text{font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ns-pax{padding:12px;border-radius:12px;background:var(--pax-tint);margin-bottom:8px}
.ns-pax__top{display:flex;align-items:center;gap:10px}
.ns-pax__id{flex:1;min-width:0}
.ns-pax__name{display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.ns-pax__seats{display:block;font-size:13px;color:var(--text-2)}
.ns-ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--divider);background:transparent;color:var(--primary);display:grid;place-items:center;flex:none;text-decoration:none}
.ns-ic svg{width:20px;height:20px}
.ns-note{display:flex;align-items:flex-start;gap:8px;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:13.5px;overflow-wrap:anywhere}
.ns-note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--text-2)}
.ns-btns{display:flex;gap:8px;margin-top:10px}
.ns-btns .btn{flex:1}
.ns-btns--main .btn{min-height:44px}
.hero-slide--next .btn{min-height:44px}
.ns-done{text-align:center;padding:10px 0 4px}
.ns-done h3{margin:0 0 6px;font-size:18px}
.ns-done p{margin:0 0 14px;color:var(--text-2);font-size:14px}
.pax-summary{margin-bottom:10px}
.pax-summary__text{font-size:13px;font-weight:600;margin-bottom:6px}
.pax-summary__segs{display:flex;gap:3px}
.pax-summary__seg{flex:1;height:6px;border-radius:3px;background:var(--divider)}
.pax-summary__seg.is-picked{background:var(--cta)}
.pax-summary__seg.is-dropped{background:var(--primary)}

/* Sections */
.section{padding:16px 12px 0}
.section__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section__title{margin:0;font-size:15px;font-weight:700}

/* Passenger card */
.pax-card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.pax-card--muted{background:var(--muted-card);border:1px dashed var(--divider)}
.pax-card--collapsed{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.pax-card__top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pax-avatar{width:36px;height:36px;border-radius:50%;background:var(--chip-soft);color:var(--chip-soft-text);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.pax-card__id{flex:1;min-width:0}
.pax-card__name{font-size:14.5px;font-weight:700;display:block}
.pax-card__meta{font-size:12px;color:var(--text-2)}
.pax-contact{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;background:var(--chip-soft);color:var(--chip-soft-text);display:grid;place-items:center;text-decoration:none}
.pax-contact svg{width:20px;height:20px}

.pax-timeline{position:relative;padding-left:18px;margin-bottom:10px}
.pax-timeline::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;border-left:2px dotted var(--divider)}
.pax-stop{position:relative;margin-bottom:10px}
.pax-stop:last-child{margin-bottom:0}
.pax-stop__dot{position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--text-2)}
.pax-stop__head{display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.pax-stop__label{font-size:11.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.02em}
.pax-stop__chip{font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--muted-card);border-radius:999px;padding:2px 8px}
.pax-stop__addr{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pax-onboard{display:inline-block;font-size:12px;font-weight:600;color:var(--chip-soft-text);background:var(--chip-soft);border-radius:999px;padding:4px 10px;margin-bottom:10px}

.pax-actions{display:flex;gap:8px}
.pax-actions .btn{flex:1}
.pax-done-line{font-size:14px;color:var(--text-2)}
.pax-done-line strong{color:var(--text)}

/* Sticky action bar */
.action-bar{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--card);border-top:1px solid var(--divider);box-shadow:var(--shadow);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.action-bar__row{display:flex;gap:10px}
.action-bar__row .btn{flex:1 1 0;min-width:0;padding:0 12px;white-space:nowrap}
.action-bar__row .btn[data-action="share"]{flex-grow:1.3}
.lbl-short{display:none}
@media (max-width:374px){.lbl-long{display:none}.lbl-short{display:inline}}

/* Sheet */
.sheet-layer{position:fixed;inset:0;z-index:10;display:none}
.sheet-layer.is-open{display:block}
.sheet-backdrop{position:absolute;inset:0;background:var(--overlay)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px;font-size:16.5px}
.sheet p{margin:0 0 18px;color:var(--text-2);font-size:14px}
.sheet__actions{display:flex;flex-direction:column;gap:8px}
.sheet__actions .btn{width:100%}

/* Toast */
.toast{position:fixed;left:16px;right:16px;bottom:90px;z-index:20;background:#111B21;color:#FFFFFF;font-size:13.5px;text-align:center;padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.is-visible{opacity:1}

.footer-space{height:8px}

var PFRoute = (function () {
/* ROUTE-START */
function haversineKm(lat1, lng1, lat2, lng2) {

/* One point per pending pickup/dropoff across all bookings. */

  var pts = [];
  (bookings || []).forEach(function (b) {
    if (!b.picked_up_at) pts.push({ lat: b.pickup_lat, lng: b.pickup_lng, label: b.pickup_label, passengerId: b.id, kind: 'pickup' });
    if (!b.dropped_off_at) pts.push({ lat: b.dropoff_lat, lng: b.dropoff_lng, label: b.dropoff_label, passengerId: b.id, kind: 'dropoff' });

  return pts;
}

var MERGE_KM = 0.15;

/* Merge points within 150m into one stop; drop stops within 150m of origin/destination. */
function dedupeStops(points, origin, dest) {
  var stops = [];
  (points || []).forEach(function (p) {
    var merged = null;
    for (var i = 0; i < stops.length; i++) {
      if (haversineKm(stops[i].lat, stops[i].lng, p.lat, p.lng) <= MERGE_KM) { merged = stops[i]; break; }
    }
    if (merged) {
      merged.members.push({ passengerId: p.passengerId, kind: p.kind, label: p.label });
    } else {
      stops.push({ lat: p.lat, lng: p.lng, label: p.label, members: [{ passengerId: p.passengerId, kind: p.kind, label: p.label }] });
    }
  });
  return stops.filter(function (s) {
    if (origin && haversineKm(s.lat, s.lng, origin.lat, origin.lng) <= MERGE_KM) return false;
    if (dest && haversineKm(s.lat, s.lng, dest.lat, dest.lng) <= MERGE_KM) return false;
    return true;
  });
}

/* 'origin' | 'dest' | null: is a point within 150m of the live/planned origin or the destination?
   Used only for display; dedupeStops (and so the Maps URL) is untouched. */
function endpointOf(pt, origin, planned, dest) {
  if (!pt || pt.lat == null || pt.lng == null) return null;
  if (origin && haversineKm(pt.lat, pt.lng, origin.lat, origin.lng) <= MERGE_KM) return 'origin';
  if (planned && planned.lat != null && haversineKm(pt.lat, pt.lng, planned.lat, planned.lng) <= MERGE_KM) return 'origin';
  if (dest && haversineKm(pt.lat, pt.lng, dest.lat, dest.lng) <= MERGE_KM) return 'dest';
  return null;
}

/* Exact shortest order (DFS + branch-and-bound) respecting pickup-before-dropoff
   per passenger, for <=8 stops; nearest-neighbour (respecting the same
   precedence) beyond that. */
function orderStops(origin, dest, stops) {
  var n = stops.length;
  if (n === 0) return [];

  var pickupIndex = {}, dropoffIndex = {};
  stops.forEach(function (s, idx) {
    s.members.forEach(function (m) {
      if (m.kind === 'pickup') pickupIndex[m.passengerId] = idx;
      else dropoffIndex[m.passengerId] = idx;
    });
  });
  var constraints = [];
  Object.keys(pickupIndex).forEach(function (pid) {
    if (Object.prototype.hasOwnProperty.call(dropoffIndex, pid) && pickupIndex[pid] !== dropoffIndex[pid]) {
      constraints.push([pickupIndex[pid], dropoffIndex[pid]]);
    }
  });

  if (n > 8) {
    console.warn('[maps] more than 8 stops (' + n + ') — using nearest-neighbour ordering');
    return nearestNeighbourOrder(origin, stops, constraints);
  }

  var predMap = {};
  constraints.forEach(function (c) { (predMap[c[1]] = predMap[c[1]] || []).push(c[0]); });

  var best = null, bestDist = Infinity;
  var used = new Array(n);
  for (var z = 0; z < n; z++) used[z] = false;
  var path = [];

  function ready(idx) {
    var preds = predMap[idx];
    if (!preds) return true;
    for (var i = 0; i < preds.length; i++) if (!used[preds[i]]) return false;
    return true;
  }

  function dfs(curLat, curLng, distSoFar) {
    if (distSoFar >= bestDist) return;
    if (path.length === n) {
      var total = distSoFar + haversineKm(curLat, curLng, dest.lat, dest.lng);
      if (total < bestDist) { bestDist = total; best = path.slice(); }
      return;
    }
    for (var i = 0; i < n; i++) {
      if (used[i] || !ready(i)) continue;
      var d = haversineKm(curLat, curLng, stops[i].lat, stops[i].lng);
      used[i] = true; path.push(i);
      dfs(stops[i].lat, stops[i].lng, distSoFar + d);
      path.pop(); used[i] = false;
    }
  }
  dfs(origin.lat, origin.lng, 0);
  if (!best) { best = []; for (var k = 0; k < n; k++) best.push(k); }
  return best.map(function (i) { return stops[i]; });
}

function nearestNeighbourOrder(origin, stops, constraints) {
  var n = stops.length;
  var used = new Array(n);
  for (var z = 0; z < n; z++) used[z] = false;
  var predMap = {};
  constraints.forEach(function (c) { (predMap[c[1]] = predMap[c[1]] || []).push(c[0]); });
  function ready(idx) {
    var preds = predMap[idx];
    if (!preds) return true;
    for (var i = 0; i < preds.length; i++) if (!used[preds[i]]) return false;
    return true;
  }
  var order = [], curLat = origin.lat, curLng = origin.lng;
  for (var k = 0; k < n; k++) {
    var bestI = -1, bestD = Infinity;
    for (var i = 0; i < n; i++) {
      if (used[i] || !ready(i)) continue;
      var d = haversineKm(curLat, curLng, stops[i].lat, stops[i].lng);
      if (d < bestD) { bestD = d; bestI = i; }

    curLat = stops[bestI].lat; curLng = stops[bestI].lng;

/* ---------- API ---------- */
function realList(token) {

    if (res.error) throw res.error;

function localDateKey(iso) {
  var d = new Date(iso);

  console.error('[manage] load failed', e);

}
/* Loads the trip list, then the trip for the selected date (today by default). */
function load(showSkeleton) {
  if (showSkeleton) { STATE.loading = true; render(); }
  apiList().then(function (list) {
    if (!list || list.error === 'invalid_token') { STATE.loading = false; STATE.errorType = 'invalid_token'; STATE.payload = null; render(); return; }
    if (!list.trips) { STATE.loading = false; STATE.errorType = 'rpc_error'; STATE.payload = null; render(); return; }
    STATE.trips = list.trips.slice().sort(function (a, b) { return new Date(a.depart_at) - new Date(b.depart_at); });
    if (!STATE.selectedDate) { STATE.selectedDate = todayKey(); STATE.stripScroll = true; }
    loadTrip(false);
  }).catch(failLoad);
}

function loadTrip(showSkeleton) {
  var t = tripForDate(STATE.selectedDate);
  STATE.selectedTripId = t ? t.id : null;
  if (!t) { STATE.loading = false; STATE.errorType = null; STATE.payload = null; render(); return; }
  if (showSkeleton) { STATE.loading = true; render(); }
  var wanted = t.id;
  apiGet(wanted).then(function (data) {
    if (STATE.selectedTripId !== wanted) return; /* user switched dates meanwhile */
    STATE.loading = false;
    if (!data || data.error === 'invalid_token') { STATE.errorType = 'invalid_token'; STATE.payload = null; }
    else if (!data.trip) { STATE.errorType = 'rpc_error'; STATE.payload = null; }
    else {
      var prevStatus = STATE.payload && STATE.payload.trip ? STATE.payload.trip.status : null;
      STATE.errorType = null; STATE.payload = data;
      var newStatus = data.trip.status;

      if (STATE.slideAuto) { STATE.heroSlide = newStatus === 'active' ? 2 : 1; STATE.slideAuto = false; }
      else if (prevStatus && prevStatus !== 'active' && newStatus === 'active') STATE.heroSlide = 2;

  if (key === STATE.selectedDate || STATE.pendingKey) return;
  STATE.selectedDate = key; STATE.stripScroll = true;
  STATE.selectedTripId = null;
  STATE.slideAuto = true; STATE.expanded = {}; STATE.payload = null; STATE.sheet = null;
  loadTrip(true);
}
function selectTrip(id) {
  if (id === STATE.selectedTripId || STATE.pendingKey) return;
  STATE.selectedTripId = id;
  STATE.slideAuto = true; STATE.expanded = {}; STATE.payload = null; STATE.sheet = null;
  loadTrip(true);
}

function doAction(action, bookingId, pendingKey) {
  if (STATE.pendingKey || !STATE.payload) return;
  var snapshot = clone(STATE.payload);
  var prevSlide = STATE.heroSlide;
  STATE.pendingKey = pendingKey;
  applyOptimistic(action, bookingId);
  if (action === 'start') STATE.heroSlide = 2;
  render();
  apiAction(action, bookingId).then(function (data) {
    STATE.pendingKey = null;
    if (!data || data.error) { STATE.payload = snapshot; if (action === 'start') STATE.heroSlide = prevSlide; toast("Couldn't update — try again"); }
    else { STATE.payload = data; }
    render();
  }).catch(function (e) {
    console.error('[manage] action failed', e);
    STATE.pendingKey = null;
    STATE.payload = snapshot;
    if (action === 'start') STATE.heroSlide = prevSlide;
    toast("Couldn't update — try again");
    render();
  });
}
function applyOptimistic(action, bookingId) {
  var p = STATE.payload; if (!p) return;
  var now = new Date().toISOString();
  if (action === 'start') p.trip.status = 'active';
  else if (action === 'end') p.trip.status = 'completed';
  else if (action === 'remove') p.bookings = p.bookings.filter(function (b) { return b.id !== bookingId; });
  else if (action === 'picked_up') p.bookings.forEach(function (b) { if (b.id === bookingId) b.picked_up_at = now; });
  else if (action === 'dropped_off') p.bookings.forEach(function (b) { if (b.id === bookingId) b.dropped_off_at = now; });
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('is-visible'); }, 3000);
}

/* ---------- Derived data ---------- */
function seatsTaken(payload) {
  return payload.bookings.reduce(function (n, b) { return n + (b.seats || 0); }, 0);
}
function nameForId(payload, id) {
  var b = payload.bookings.find(function (x) { return x.id === id; });
  return b ? firstName(b.name) : '';
}
function currentOriginForDisplay(payload) {
  var trip = payload.trip;
  var fix = STATE.gps.fix;
  if (fix) return { lat: fix.lat, lng: fix.lng, label: STATE.gps.label || (fix.lat + ',' + fix.lng), isGps: true };
  return { lat: trip.origin_lat, lng: trip.origin_lng, label: trip.origin_label, isGps: false };
}
function computeRoute(payload) {
  var trip = payload.trip;
  var origin = currentOriginForDisplay(payload);
  var dest = { lat: trip.dest_lat, lng: trip.dest_lng, label: trip.dest_label };
  var pts = PFRoute.buildStops(origin, dest, payload.bookings);
  var stops = PFRoute.dedupeStops(pts, origin, dest);
  var ordered = PFRoute.orderStops(origin, dest, stops);
  /* Display-only: passengers at the origin/destination (removed by dedupeStops) attach to Start / Destination.
     `stops` stays as-is for the Maps card. */
  var planned = { lat: trip.origin_lat, lng: trip.origin_lng };
  var startMembers = [], endMembers = [], startPts = [], endPts = [];
  payload.bookings.forEach(function (b) {
    [{ kind: 'pickup', lat: b.pickup_lat, lng: b.pickup_lng, label: b.pickup_label, done: !!b.picked_up_at },
     { kind: 'dropoff', lat: b.dropoff_lat, lng: b.dropoff_lng, label: b.dropoff_label, done: !!b.dropped_off_at }].forEach(function (p) {
      var w = PFRoute.endpointOf(p, origin, planned, dest);
      if (!w) return;
      var m = { passengerId: b.id, kind: p.kind, label: p.label, done: p.done };
      (w === 'origin' ? startMembers : endMembers).push(m);
      if (!p.done) (w === 'origin' ? startPts : endPts).push({ lat: p.lat, lng: p.lng, label: p.label, member: m });
    });
  });
  var viewPts = pts.filter(function (p) { return !PFRoute.endpointOf(p, origin, planned, dest); });
  var viewStops = PFRoute.orderStops(origin, dest, PFRoute.dedupeStops(viewPts, origin, dest));
  function endStop(list) {
    if (!list.length) return null;
    return { lat: list[0].lat, lng: list[0].lng, label: list[0].label, members: list.map(function (p) { return { passengerId: p.member.passengerId, kind: p.member.kind, label: p.label }; }) };
  }
  return { origin: origin, dest: dest, stops: ordered, viewStops: viewStops, startMembers: startMembers, endMembers: endMembers, startStop: endStop(startPts), endStop: endStop(endPts) };
}
function doneStopsForSlide2(payload, route) {
  var items = [], planned = { lat: payload.trip.origin_lat, lng: payload.trip.origin_lng };
  payload.bookings.forEach(function (b) {
    if (b.picked_up_at && !PFRoute.endpointOf({ lat: b.pickup_lat, lng: b.pickup_lng }, route.origin, planned, route.dest)) items.push({ id: b.id, name: b.name, label: b.pickup_label, kind: 'pickup', ts: b.picked_up_at });
    if (b.dropped_off_at && !PFRoute.endpointOf({ lat: b.dropoff_lat, lng: b.dropoff_lng }, route.origin, planned, route.dest)) items.push({ id: b.id, name: b.name, label: b.dropoff_label, kind: 'dropoff', ts: b.dropped_off_at });
  });
  items.sort(function (a, b) { return new Date(a.ts) - new Date(b.ts); });
  return items;
}
function shareText(payload) {
  var trip = payload.trip;
  return 'Book a seat on my ride ' + shortLabel(trip.origin_label) + ' → ' + shortLabel(trip.dest_label) + ', ' + fmtDateShort(trip.depart_at) + (trip.join_url ? ': ' + trip.join_url : '');
}
function doShare() {
  if (!STATE.payload) return;
  var text = shareText(STATE.payload);
  if (navigator.share) {
    navigator.share({ text: text }).catch(function (e) { if (e && e.name === 'AbortError') return; copyToClipboard(text); });
  } else {
    copyToClipboard(text);
  }
}
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast('Link copied'); }, function () { toast('Link copied'); });
  } else {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) {}
    toast('Link copied');
  }
}

/* ---------- GPS + reverse geocoding ---------- */
function reverseGeocode(lat, lng) {
  if (!MAPBOX_TOKEN || typeof fetch !== 'function') return Promise.resolve(null);
  var params = new URLSearchParams();
  params.set('longitude', String(lng));
  params.set('latitude', String(lat));
  params.set('types', 'address,street,neighborhood,locality,place');
  params.set('limit', '1');
  params.set('access_token', MAPBOX_TOKEN);
  return fetch('https://api.mapbox.com/search/geocode/v6/reverse?' + params.toString())
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (json) {
      var f = json && json.features && json.features[0];
      var addr = f && f.properties && f.properties.full_address;
      return addr || null;
    })
    .catch(function () { return null; });
}
function roundKey(lat, lng) { return lat.toFixed(3) + ',' + lng.toFixed(3); }
function resolveGpsLabel(lat, lng) {
  var key = roundKey(lat, lng);
  if (Object.prototype.hasOwnProperty.call(geoLabelCache, key)) { STATE.gps.label = geoLabelCache[key]; return; }
  reverseGeocode(lat, lng).then(function (label) {
    geoLabelCache[key] = label;
    STATE.gps.label = label;
    scheduleRouteRerender(true);
  });
}
function scheduleRouteRerender(force) {
  if (!STATE.payload) return;
  var now = Date.now(), last = STATE.routeThrottle, fix = STATE.gps.fix;
  var movedFar = !!(fix && last.lat != null && PFRoute.haversineKm(last.lat, last.lng, fix.lat, fix.lng) > 0.15);
  if (!force && (now - last.ts) < 15000 && !movedFar) return;
  STATE.routeThrottle = { ts: now, lat: fix ? fix.lat : null, lng: fix ? fix.lng : null };
  render();
}
function setGpsFix(lat, lng) {
  STATE.gps.fix = { lat: lat, lng: lng, ts: Date.now() };
  resolveGpsLabel(lat, lng);
  scheduleRouteRerender(false);
}
function initGps() {
  var params = new URLSearchParams(location.search);
  var gpsParam = params.get('gps');
  if (STATE.isMock && gpsParam === 'off') { STATE.gps.denied = true; return; }
  if (STATE.isMock && gpsParam) {
    var parts = gpsParam.split(',').map(Number);
    if (parts.length === 2 && isFinite(parts[0]) && isFinite(parts[1])) { setGpsFix(parts[0], parts[1]); return; }
  }
  if (!('geolocation' in navigator)) return;
  try {
    navigator.geolocation.watchPosition(function (pos) {
      setGpsFix(pos.coords.latitude, pos.coords.longitude);
    }, function () { /* denied/unavailable — fall back to trip origin */ }, { enableHighAccuracy: true, maximumAge: 30000 });
  } catch (e) {}
}
function resolveOriginForMaps() {
  return new Promise(function (resolve) {
    var trip = STATE.payload.trip;
    var fix = STATE.gps.fix;
    if (fix && (Date.now() - fix.ts) < 30000) { resolve({ lat: fix.lat, lng: fix.lng }); return; }
    if (STATE.gps.denied) { resolve({ lat: trip.origin_lat, lng: trip.origin_lng }); return; }
    var settled = false;
    var backstop = setTimeout(function () {
      if (settled) return; settled = true;
      resolve({ lat: trip.origin_lat, lng: trip.origin_lng });
    }, 8000);
    try {
      navigator.geolocation.getCurrentPosition(function (pos) {
        if (settled) return; settled = true; clearTimeout(backstop);
        resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      }, function () {
        if (settled) return; settled = true; clearTimeout(backstop);
        resolve({ lat: trip.origin_lat, lng: trip.origin_lng });
      }, { timeout: 6000 });
    } catch (e) {
      if (!settled) { settled = true; clearTimeout(backstop); resolve({ lat: trip.origin_lat, lng: trip.origin_lng }); }
    }
  });
}
function resolveOriginLabelForMaps(pt) {
  return new Promise(function (resolve) {
    var key = roundKey(pt.lat, pt.lng);
    if (Object.prototype.hasOwnProperty.call(geoLabelCache, key) && geoLabelCache[key]) { resolve(geoLabelCache[key]); return; }
    var done = false;
    var t = setTimeout(function () { if (!done) { done = true; resolve(null); } }, 3000);
    reverseGeocode(pt.lat, pt.lng).then(function (label) {
      if (done) return; done = true; clearTimeout(t);
      geoLabelCache[key] = label;
      resolve(label);
    });
  });
}
function isMobileOrPwa() {
  return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
    !!navigator.standalone ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function openMapsTap(btn) {
  if (!STATE.payload) return;
  var trip = STATE.payload.trip;
  var lab = btn.querySelector('[data-maps-label]') || btn;
  var origLabel = lab.textContent;
  lab.textContent = 'Opening…';
  var mobile = isMobileOrPwa();
  var w = null;
  if (!mobile) { try { w = window.open('about:blank', '_blank'); } catch (e) { w = null; } }

  resolveOriginForMaps().then(function (pt) {
    return resolveOriginLabelForMaps(pt).then(function (label) {
      return { lat: pt.lat, lng: pt.lng, label: label || (pt.lat + ',' + pt.lng) };
    });
  }).then(function (origin) {
    var dest = { lat: trip.dest_lat, lng: trip.dest_lng, label: trip.dest_label };
    var pts = PFRoute.buildStops(origin, dest, STATE.payload.bookings);
    var stops = PFRoute.dedupeStops(pts, origin, dest);
    var ordered = PFRoute.orderStops(origin, dest, stops);
    var url = PFRoute.buildMapsUrl(origin, dest, ordered);
    console.info('[maps] ' + ordered.length + ' stops');
    if (DEBUG() || STATE.isMock) console.info('[maps] url', url);
    if (mobile || !w) {
      var a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } else {
      w.location.href = url;
    }
    lab.textContent = origLabel;
  }).catch(function (e) {
    console.error('[manage] open maps failed', e);
    lab.textContent = origLabel;
  });
}

function dateStrip() {
  var today = todayKey();
  var byDate = {}, counts = {}, keys = [today];
  STATE.trips.forEach(function (t) {
    var k = localDateKey(t.depart_at);
    if (!byDate[k]) { byDate[k] = t; if (keys.indexOf(k) < 0) keys.push(k); }
    counts[k] = (counts[k] || 0) + 1;
    byDate[k].count = (byDate[k].count || 0) + 1;
  });
  keys.sort();
  var pills = keys.map(function (k) {
    var t = byDate[k];
    var dstr = fmtDateShort(t ? t.depart_at : new Date().toISOString());
    var top, sub;
    if (k === today) { top = 'Today'; sub = dstr; }
    else if (k < today) { top = dstr; sub = counts[k] > 1 ? counts[k] + ' rides' : 'Done'; }
    else { top = dstr; sub = counts[k] > 1 ? counts[k] + ' rides' : (t.status === 'completed' ? 'Done' : (t.status === 'active' ? 'Live' : 'Upcoming')); }
    return '<button type="button" class="date-pill' + (k === STATE.selectedDate ? ' is-selected' : '') + '" data-action="pick-date" data-date="' + k + '"' + (k === STATE.selectedDate ? ' aria-current="date"' : '') + '>' +
      '<span class="date-pill__top">' + esc(top) + '</span><span class="date-pill__sub' + (k === today ? ' date-pill__sub--date' : '') + '">' + esc(sub) + '</span></button>';
  }).join('');
  return '<section class="date-strip"><p class="date-strip__label">Your rides</p><div class="date-strip__row" id="dateStrip">' + pills + '</div>' + tripChips() + '</section>';
}
function fmtTime12(iso) { return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
/* One chip per trip when the selected date has 2+ trips. */
function tripChips() {
  var list = tripsForDate(STATE.selectedDate);
  if (list.length < 2) return '';
  var chips = list.map(function (t) {
    var sel = t.id === STATE.selectedTripId;
    var label = fmtTime12(t.depart_at) + ' · ' + shortLabel(t.origin_label) + ' → ' + shortLabel(t.dest_label);
    return '<button type="button" class="trip-chip' + (sel ? ' is-selected' : '') + '" data-action="pick-trip" data-id="' + esc(t.id) + '"' + (sel ? ' aria-current="true"' : '') + '>' + esc(label) + '</button>';
  }).join('');

}

/* ---------- Render: hero ---------- */
function routePax(payload, id) { return '<b style="color:' + colorFor(id) + '">' + esc(nameForId(payload, id)) + '</b>'; }
function routeStopRow(payload, stop, num) {
  var pickups = stop.members.filter(function (m) { return m.kind === 'pickup'; });
  var dropoffs = stop.members.filter(function (m) { return m.kind === 'dropoff'; });
  var parts = ['Stop ' + num];
  if (pickups.length) parts.push('Pick: ' + pickups.map(function (m) { return routePax(payload, m.passengerId); }).join(', '));
  if (dropoffs.length) parts.push('Drop: ' + dropoffs.map(function (m) { return routePax(payload, m.passengerId); }).join(', '));
  return '<div class="route-stop"><span class="route-stop__dot"></span>' +
    '<div class="route-stop__text"><span class="route-stop__label">' + esc(shortLabel(stop.label)) + '</span><span class="route-stop__addr">' + parts.join(' · ') + '</span></div></div>';
}
/* "Start · Picked: A ✓ · Pick: B" text for the Start / Destination rows. */
function endpointText(payload, word, members) {
  var parts = [word];
  [['pickup', 'Picked', 'Pick'], ['dropoff', 'Dropped', 'Drop']].forEach(function (k) {
    var done = members.filter(function (m) { return m.kind === k[0] && m.done; });
    var pend = members.filter(function (m) { return m.kind === k[0] && !m.done; });
    if (done.length) parts.push(k[1] + ': ' + done.map(function (m) { return routePax(payload, m.passengerId); }).join(', ') + ' ✓');
    if (pend.length) parts.push(k[2] + ': ' + pend.map(function (m) { return routePax(payload, m.passengerId); }).join(', '));
  });
  return parts.join(' · ');
}
function mapsCard(payload) {

  var sub = n > 0 ? (n + ' stop' + (n === 1 ? '' : 's') + ' · shortest order') : 'Pickup to destination';
  return '<button type="button" class="maps-card" data-action="open-maps">' +
    '<span class="maps-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></span>' +
    '<span class="maps-card__text"><span class="maps-card__title">Full route in Maps</span><span class="maps-card__sub" data-maps-label>' + esc(sub) + '</span></span>' +
    '<span class="maps-card__btn">Open</span></button>';
}

  }

}
function nsPaxRow(b, kind, multi, canAct, off) {
  var digits = String(b.phone || '').replace(/\D/g, '');
  var contacts = digits ?
    '<a class="ns-ic" href="tel:+' + digits + '" aria-label="Call ' + esc(firstName(b.name)) + '">' + NS_ICON_PHONE + '</a>' +
    '<a class="ns-ic" href="https://wa.me/' + digits + '" target="_blank" rel="noopener" aria-label="Message ' + esc(firstName(b.name)) + '">' + NS_ICON_WA + '</a>' : '';

    '<span class="pax-avatar">' + esc(initial(b.name)) + '</span>' +

}
function nextStopSlide(payload) {
  var trip = payload.trip, bookings = payload.bookings;
  var completed = trip.status === 'completed';
  var canAct = !completed;
  var off = trip.status !== 'active'; /* draft: buttons shown but disabled until the trip starts */
  var route = computeRoute(payload);
  var remaining = [];
  if (!completed) {
    if (route.startStop) remaining.push(route.startStop);
    remaining = remaining.concat(route.viewStops);
    if (route.endStop) remaining.push(route.endStop);
  }
  var hasDest = route.endMembers.some(function (m) { return m.kind === 'dropoff'; });
  var undropped = bookings.filter(function (b) { return !b.dropped_off_at; });
  var done = nsDoneCount(payload, remaining);
  var total = done + remaining.length + (hasDest ? 0 : 1);

  var mode, stop = null, members = [], kind = 'dropoff', addrLabel = '', addrText = '', pillText = '';
  if (completed) mode = 'completed';
  else if (!bookings.length) mode = 'empty';
  else if (remaining.length) {
    mode = 'stop'; stop = remaining[0];
    members = stop.members.map(function (m) { return { b: bookings.find(function (x) { return x.id === m.passengerId; }), kind: m.kind }; }).filter(function (m) { return m.b; });
    kind = stop.members[0].kind;
    addrText = stop.label;
    pillText = stop === route.endStop ? 'DESTINATION' : (kind === 'pickup' ? 'NEXT STOP · PICKUP' : 'NEXT STOP · DROP-OFF');
  } else if (undropped.length) {
    mode = 'dest';
    members = undropped.map(function (b) { return { b: b, kind: 'dropoff' }; });
    addrText = trip.dest_label;
    pillText = 'DESTINATION';
  } else mode = 'alldone';
  addrLabel = kind === 'pickup' ? 'Pickup location' : 'Drop-off location';

  var allDone = mode === 'completed' || mode === 'alldone';
  var curIdx = allDone ? total - 1 : (mode === 'dest' ? total - 1 : done);
  var x = allDone ? total : Math.min(done + 1, total);
  var segs = '';
  for (var i = 0; i < total; i++) {
    segs += '<span class="ns-seg' + (allDone || i < curIdx ? ' is-done' : (i === curIdx ? ' is-current' : '')) + '"></span>';
  }
  var target = ((curIdx + 0.5) / total * 100).toFixed(2);
  var startPct = STATE.carPct != null ? STATE.carPct : target;
  var prog = '<div class="ns-prog__row"><strong>Stop ' + x + ' of ' + total + '</strong><span>' + esc(shortLabel(trip.dest_label)) + '</span></div>' +
    '<div class="ns-bar"><span class="ns-car" data-to="' + target + '" style="left:' + startPct + '%">' + NS_ICON_CAR + '</span><div class="ns-segs">' + segs + '</div></div>';

  var body = '';
  if (mode === 'completed') {
    var dn = bookings.filter(function (b) { return !!b.dropped_off_at; }).length;
    body = '<div class="ns-done"><h3>Trip ended · ' + dn + ' passenger' + (dn === 1 ? '' : 's') + ' dropped off</h3></div>';
  } else if (mode === 'empty') {
    body = '<div class="ns-done"><h3>No passengers yet</h3><p>Share your link to get bookings.</p></div>';
  } else if (mode === 'alldone') {
    body = '<div class="ns-done"><h3>All stops done ✓</h3><p>Everyone has been dropped off.</p>' +
      (trip.status === 'active' ? '<button type="button" class="btn btn-cta btn-full" data-action="open-end-sheet"' + (STATE.pendingKey === 'end' ? ' disabled' : '') + '>' + ico('flag') + 'End trip</button>' : '') + '</div>';
  } else {
    var fix = STATE.gps.fix, eta = '';
    var tLat = stop ? stop.lat : trip.dest_lat, tLng = stop ? stop.lng : trip.dest_lng;
    var d = fix ? PFRoute.haversineKm(fix.lat, fix.lng, tLat, tLng) : null;
    if (d != null) eta = '~' + Math.max(1, Math.round(d / 40 * 60)) + ' min · ' + (Math.round(d * 10) / 10).toFixed(1) + ' km';
    var multi = members.length > 1;
    var mapsHref = 'https://www.google.com/maps/dir/?api=1&destination=' + (tLat != null && tLng != null ? tLat + ',' + tLng : encodeURIComponent(addrText));
    body = '<div class="ns-pillrow"><span class="ns-pill">' + pillText + '</span>' + (eta ? '<span class="ns-eta">' + eta + '</span>' : '') + '</div>' +
      '<a class="ns-addr" href="' + esc(mapsHref) + '" target="_blank" rel="noopener" aria-label="Directions to ' + esc(addrText) + '"><span class="ns-addr__label">' + addrLabel + '</span><div class="ns-addr__row">' + NS_ICON_PIN + '<span class="ns-addr__text">' + esc(addrText) + '</span>' + NS_ICON_GO + '</div></a>' +
      members.map(function (m) { return nsPaxRow(m.b, m.kind, multi, canAct, off); }).join('') +
      (multi && off && canAct ? '<p class="ns-hint">Start the trip to pick up passengers</p>' : '');

  return prog + body;
}

function passengersSection(payload) {

/* ---------- Sheet ---------- */

      '<button type="button" class="btn ' + (s.danger ? 'btn-danger' : 'btn-cta') + '" data-action="sheet-confirm">' + (s.confirmIcon ? ico(s.confirmIcon) : '') + esc(s.confirmLabel) + '</button>' +
      '<button type="button" class="btn btn-secondary" data-action="sheet-cancel">Cancel</button>' +

function openSheet(opts) { STATE.sheet = opts; sheetHtml(); }
function closeSheet() { STATE.sheet = null; sheetHtml(); }

/* ---------- Full render ---------- */
function render() {
  var app = document.getElementById('app');
  if (STATE.view === 'profile') { app.classList.remove('has-bar'); renderProfile(app); sheetHtml(); return; }
  if (STATE.errorType) { app.classList.remove('has-bar'); app.innerHTML = errorPage(); sheetHtml(); return; }
  var oldStrip = document.getElementById('dateStrip');
  var keepScroll = oldStrip ? oldStrip.scrollLeft : 0;
  var body = '', showBar = false, payload = STATE.payload;
  if (STATE.loading) body = skeleton();
  else if (!payload) body = emptyDay();
  else {
    showBar = payload.trip.status !== 'completed';
    body = heroSection(payload) + passengersSection(payload) + '<div class="footer-space"></div>' + actionBar(payload);
  }
  if (payload) {
    STATE.trips.forEach(function (t) { if (t.id === payload.trip.id) t.status = payload.trip.status; });
  }
  app.classList.toggle('has-bar', showBar);
  app.innerHTML = header() + dateStrip() + body;
  sheetHtml();

  var strip = document.getElementById('dateStrip');
  if (strip) {
    var sel = strip.querySelector('.is-selected');
    if (STATE.stripScroll && sel) {
      STATE.stripScroll = false;
      strip.scrollLeft = sel.offsetLeft - (strip.clientWidth - sel.offsetWidth) / 2;
    } else { strip.scrollLeft = keepScroll; }
  }
  if (STATE.loading || !payload) return;

  var car = document.querySelector('.ns-car');
  if (car) {
    var tgt = car.getAttribute('data-to');
    void car.offsetWidth;
    car.style.left = tgt + '%';
    STATE.carPct = tgt;
  }

  var track = document.getElementById('heroTrack');
  if (heroRO) { heroRO.disconnect(); heroRO = null; }
  if (track) {
    track.scrollLeft = STATE.heroSlide * track.clientWidth;
    fitHero(false);
    if (window.ResizeObserver) {
      heroRO = new ResizeObserver(function () { fitHero(true); });
      track.querySelectorAll('.hero-slide').forEach(function (sl) { heroRO.observe(sl); });
    }
    track.onscroll = function () {
      var idx = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      if (idx !== STATE.heroSlide) {
        STATE.heroSlide = idx;
        document.querySelectorAll('.hero-dot').forEach(function (d, i) { d.classList.toggle('is-active', i === idx); });
        fitHero(true);
      }
    };
  }
}

/* Size the hero track to the active slide so short slides leave no empty space */
var heroRO = null;
function fitHero(animate) {
  var track = document.getElementById('heroTrack');
  if (!track) return;
  var sl = track.querySelectorAll('.hero-slide')[STATE.heroSlide];
  if (!sl) return;
  var h = sl.offsetHeight;
  if (!h || track.style.height === h + 'px') return;
  if (animate) { track.style.height = h + 'px'; return; }
  var prev = track.style.transition;
  track.style.transition = 'none';
  track.style.height = h + 'px';
  void track.offsetHeight;
  track.style.transition = prev;
}

/* ---------- Profile screen ---------- */
var THEME_KEY = 'pf_theme';
function getTheme() { try { var v = localStorage.getItem(THEME_KEY); return (v === 'light' || v === 'dark') ? v : 'system'; } catch (e) { return 'system'; } }
function setTheme(v) {
  try { if (v === 'light' || v === 'dark') { document.documentElement.setAttribute('data-theme', v); localStorage.setItem(THEME_KEY, v); } else { document.documentElement.removeAttribute('data-theme'); localStorage.removeItem(THEME_KEY); } } catch (e) {}
}
function initials(name) {
  var p = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0].charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase();
}
function fmtMemberSince(iso) {
  var d = new Date(iso);
  return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}
function fmtCAD(n) { var v = Number(n) || 0; return '$' + v.toLocaleString('en-CA', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
/* Notification switch state: { on, disabled, hint } */
function notifView() {
  var p = STATE.profile || {};
  var st = (window.PFNotify && window.PFNotify.state) ? window.PFNotify.state() : 'unsupported';
  var on = !!p.notifications_enabled && (STATE.isMock || st === 'granted');
  if (st === 'denied') return { on: false, disabled: true, hint: 'Notifications are blocked in your browser settings. Allow them for pathfynder.ca to turn this on.' };
  if (st === 'ios-needs-install') return { on: false, disabled: false, hint: 'On iPhone, add Pathfynder to your Home Screen first. Tap to see how.' };
  if (st === 'ios-too-old') return { on: false, disabled: true, hint: 'Alerts need iOS 16.4 or newer.' };
  if (st === 'unsupported' || st === 'in-app-browser') return { on: false, disabled: true, hint: 'This browser cannot receive alerts. Open Pathfynder in Safari or Chrome.' };
  return { on: on, disabled: STATE.notifBusy, hint: '' };
}
function profileHeader() {
  return '<header class="app-bar"><div class="pf-bar__inner"><button type="button" class="pf-back" data-action="pf-back" aria-label="Back">' + ico('arrowLeft') + '</button><div><h1 class="app-bar__title">Profile</h1></div></div></header>';
}
function profileBody(p) {
  var avatar = p.photo_url ? '<img src="' + esc(p.photo_url) + '" alt="">' : esc(initials(p.name));
  var nameBlock = STATE.editingName
    ? '<div class="pf-edit"><input class="pf-input" id="pfNameInput" type="text" maxlength="60" autocomplete="name" aria-label="Your name" value="' + esc(STATE.nameDraft) + '">' +
      (STATE.nameError ? '<p class="pf-err">' + esc(STATE.nameError) + '</p>' : '') +
      '<div class="pf-edit__btns"><button type="button" class="btn btn-secondary" data-action="pf-name-cancel">Cancel</button><button type="button" class="btn btn-cta" data-action="pf-name-save">Save</button></div></div>'
    : '<div class="pf-name"><span>' + esc(p.name || 'Driver') + '</span><button type="button" class="pf-pencil" data-action="pf-name-edit" aria-label="Edit name">' + ico('pencil') + '</button></div>';
  var s = p.stats || {};
  var nv = notifView();
  var th = getTheme();
  function seg(v, label) { return '<button type="button" data-action="pf-theme" data-id="' + v + '" aria-pressed="' + (th === v) + '">' + label + '</button>'; }
  return '<div class="pf-wrap">' +
    '<section class="pf-card pf-head"><div class="pf-avatar-wrap"><div class="pf-avatar">' + avatar + '</div><button type="button" class="pf-cam" data-action="pf-photo" aria-label="Change photo">' + ico('camera') + '</button></div>' +
      '<input type="file" id="pfPhotoInput" accept="image/*" hidden>' + nameBlock + '</section>' +
    '<section class="pf-card"><h2 class="pf-h">WhatsApp account</h2><div class="pf-row"><span class="pf-lock">' + ico('lock') + '</span><div class="pf-row__t"><b>' + esc(p.whatsapp_masked || '') + '</b><span>Linked to your Pathfynder account. Can\'t be changed here.</span></div></div></section>' +
    '<section class="pf-card"><h2 class="pf-h">Rides summary</h2><div class="pf-stats">' +
      '<div class="pf-stat"><b>' + esc(Number(s.trips_completed) || 0) + '</b><span>Trips completed</span></div>' +
      '<div class="pf-stat"><b>' + esc(fmtMemberSince(s.member_since)) + '</b><span>Member since</span></div>' +
      '<div class="pf-stat"><b>' + esc(Number(s.passengers_drove) || 0) + '</b><span>Passengers drove</span></div>' +
      '<div class="pf-stat"><b>' + esc(fmtCAD(s.total_earned)) + '</b><span>Total saved (CAD)</span></div></div></section>' +
    '<section class="pf-card"><h2 class="pf-h">Notification alerts</h2><div class="pf-row"><span class="pf-row-ic">' + ico('bell') + '</span><div class="pf-row__t"><b>Ride alerts</b><span id="pfNotifSub">' + esc(nv.hint || (nv.on ? 'On for this device' : 'Off')) + '</span></div>' +
      '<button type="button" class="pf-switch" id="pfNotifSwitch" role="switch" data-action="pf-notif" aria-checked="' + nv.on + '" aria-label="Notification alerts"' + (nv.disabled ? ' disabled' : '') + '></button></div></section>' +
    '<section class="pf-card"><h2 class="pf-h">Appearance</h2><div class="pf-seg" role="group" aria-label="Theme">' + seg('light', 'Light') + seg('dark', 'Dark') + seg('system', 'System') + '</div></section>' +
    '<section class="pf-card"><h2 class="pf-h">Contact support</h2><a class="pf-row" id="pfSupport" href="mailto:pathfynder.ca@gmail.com?subject=Pathfynder%20driver%20support"><span class="pf-row-ic">' + ico('mail') + '</span><div class="pf-row__t"><b>Email support</b><span>We usually reply within a day.</span></div></a></section>' +
    '</div>';
}
function renderProfile(app) {
  var body;
  if (STATE.profileLoading && !STATE.profile) body = '<div class="pf-wrap"><div class="pf-skel"></div><div class="pf-skel"></div><div class="pf-skel"></div></div>';
  else if (!STATE.profile) body = '<div class="pf-wrap"><div class="pf-card"><p class="pf-err">' + esc(STATE.profileError || "We couldn't load your profile. Please try again.") + '</p><button type="button" class="btn btn-secondary btn-full" data-action="pf-retry">Try again</button></div></div>';
  else body = profileBody(STATE.profile);
  var y = window.pageYOffset || 0; /* keep scroll across re-renders; opening the profile resets it in profileAction */
  app.innerHTML = profileHeader() + body;
  var inp = document.getElementById('pfNameInput');
  if (inp) { inp.focus({ preventScroll: true }); inp.setSelectionRange(inp.value.length, inp.value.length); }
  var f = document.getElementById('pfPhotoInput');
  if (f) f.onchange = function () { if (f.files && f.files[0]) handlePhoto(f.files[0]); f.value = ''; };
  window.scrollTo(0, y);
}
function loadProfile() {
  STATE.profileLoading = true; STATE.profileError = null; render();
  apiProfileGet().then(function (data) {
    if (!data || data.error) throw new Error((data && data.error) || 'empty');
    STATE.profile = data; STATE.profileLoading = false; render();
  }).catch(function (e) {
    console.error('[manage] profile load failed', e);
    STATE.profileLoading = false; STATE.profile = null;
    STATE.profileError = "We couldn't load your profile right now. Please try again in a moment.";
    render();
  });
}
function saveProfile(patch, okMsg) {
  return apiProfileUpdate(patch).then(function (data) {
    if (!data || data.error) throw new Error((data && data.error) || 'empty');
    if (patch.name != null) STATE.profile.name = data.name || patch.name;
    if (patch.photo != null) STATE.profile.photo_url = data.photo_url || patch.photo;
    if (okMsg) toast(okMsg);
    return true;
  }).catch(function (e) {
    console.error('[manage] profile save failed', e);
    toast("Couldn't save that. Please try again.");
    return false;
  });
}
/* Crops to a centred square and resizes to 256px, returns a JPEG data URL. */
function resizeImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var side = Math.min(img.naturalWidth, img.naturalHeight);
        var c = document.createElement('canvas'); c.width = 256; c.height = 256;
        c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('bad_image')); };
    img.src = url;
  });
}
function handlePhoto(file) {
  if (!/^image\//.test(file.type)) { toast('Please choose an image.'); return; }
  resizeImage(file).then(function (dataUrl) {
    return saveProfile({ photo: dataUrl }, 'Photo updated');
  }).then(function () { render(); }).catch(function () { toast("Couldn't use that image. Try another."); });
}
/* Links this browser's push subscription to the driver via driver_notify_set (manage token, not a notify_requests uuid).
   PFNotify.enable(null) reuses the shared permission/VAPID/subscribe code; the server adopts that unlinked row. Resolves to the new on/off state. */
function driverNotifySet(turnOn) {
  function currentSub() {
    return navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); });
  }
  function call(sub, on) {
    var j = sub.toJSON();
    return db.rpc('driver_notify_set', { p_token: STATE.token, p_endpoint: j.endpoint, p_p256dh: (j.keys || {}).p256dh || null, p_auth: (j.keys || {}).auth || null, p_on: on }).then(function (res) {
      if (res.error) throw res.error;
      if (!res.data || res.data.error) throw new Error((res.data && res.data.error) || 'notify_failed');
      return on;
    });
  }
  if (turnOn) {
    return window.PFNotify.enable(null).then(function (st) {
      if (st !== 'granted') return false;
      return currentSub().then(function (sub) { if (!sub) throw new Error('no_subscription'); return call(sub, true); });
    });
  }
  return currentSub().then(function (sub) { return sub ? call(sub, false) : false; });
}
function toggleNotif() {
  var nv = notifView();
  if (nv.disabled || STATE.notifBusy) return;
  if (window.PFInstall && window.PFInstall.needed()) { window.PFInstall.open(); return; }
  var turnOn = !nv.on;
  if (STATE.isMock) { STATE.profile.notifications_enabled = turnOn; render(); return; } /* mock: don't hit the real notify RPCs */
  STATE.notifBusy = true; render();
  driverNotifySet(turnOn).then(function (on) {
    STATE.profile.notifications_enabled = on;
  }).catch(function (e) {
    console.error('[manage] notif toggle failed', e);
    toast("Couldn't change alerts. Please try again.");
  }).then(function () { STATE.notifBusy = false; render(); });
}
/* Returns true when handled. */
function profileAction(action, t) {
  if (action === 'profile') { STATE.view = 'profile'; STATE.editingName = false; window.scrollTo(0, 0); if (STATE.profile) render(); if (!STATE.profile || !STATE.profileLoading) loadProfile(); return true; }
  if (action === 'pf-back') { STATE.view = 'home'; STATE.editingName = false; render(); return true; }
  if (action === 'pf-retry') { loadProfile(); return true; }
  if (action === 'pf-photo') { var f = document.getElementById('pfPhotoInput'); if (f) f.click(); return true; }
  if (action === 'pf-name-edit') { STATE.editingName = true; STATE.nameDraft = STATE.profile.name || ''; STATE.nameError = null; render(); return true; }
  if (action === 'pf-name-cancel') { STATE.editingName = false; STATE.nameError = null; render(); return true; }
  if (action === 'pf-name-save') {
    var inp = document.getElementById('pfNameInput');
    var v = inp ? inp.value.trim() : '';
    if (!v) { STATE.nameDraft = ''; STATE.nameError = 'Please enter your name.'; render(); return true; }
    saveProfile({ name: v }, 'Name updated').then(function (ok) {
      if (ok) { STATE.editingName = false; STATE.nameError = null; } else { STATE.nameDraft = v; }
      render();
    });
    return true;
  }
  if (action === 'pf-theme') { setTheme(t.getAttribute('data-id')); render(); return true; }
  if (action === 'pf-notif') { toggleNotif(); return true; }
  return false;
}

/* ---------- Events ---------- */
document.body.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]');
  if (!t) return;
  if (e.target.closest('a.pax-contact')) return;
  var action = t.getAttribute('data-action');
  var id = t.getAttribute('data-id');

  if (action.indexOf('pf-') === 0 || action === 'profile') { if (profileAction(action, t)) return; }
  if (action === 'pick-trip') { selectTrip(t.getAttribute('data-id')); return; }
  if (action === 'pick-date') { selectDate(t.getAttribute('data-date')); return; }
  if (action === 'share') { doShare(); return; }
  if (action === 'open-maps') { openMapsTap(t); return; }
  if (action === 'dot') {
    var idx = Number(t.getAttribute('data-index'));
    STATE.heroSlide = idx;
    var track = document.getElementById('heroTrack');
    if (track) track.scrollLeft = idx * track.clientWidth;
    fitHero(true);
    document.querySelectorAll('.hero-dot').forEach(function (d, i) { d.classList.toggle('is-active', i === idx); });
    return;
  }
  if (action === 'toggle-expand') { STATE.expanded[id] = !STATE.expanded[id]; render(); return; }
  if (action === 'open-start-sheet') { openSheet({ title: 'Start this ride now?', message: 'Your passengers will see that the ride has started.', confirmLabel: 'Start ride', confirmIcon: 'play', danger: false, doAction: 'start', bookingId: null }); return; }
  if (action === 'open-end-sheet') { openSheet({ title: 'End this ride?', message: "Make sure everyone has been dropped off. This can't be undone.", confirmLabel: 'End ride', confirmIcon: 'flag', danger: true, doAction: 'end', bookingId: null }); return; }
  if (action === 'remove') {
    var b = STATE.payload && STATE.payload.bookings.find(function (x) { return x.id === id; });
    var fn = b ? firstName(b.name) : 'this passenger';
    var bd = b ? String(b.phone || '').replace(/\D/g, '') : '';
    openSheet({ title: 'Remove ' + fn + ' from this ride?', message: fn + ' booked a seat with you. Let them know before you remove them, so they have time to find another ride.', confirmLabel: 'Remove passenger', confirmIcon: 'userMinus', danger: true, doAction: 'remove', bookingId: id,
      linkLabel: bd ? 'Message ' + fn + ' first' : null,
      linkHref: bd ? 'https://wa.me/' + bd + '?text=' + encodeURIComponent('Hi ' + fn + ", sorry — I can't take you on this ride anymore. ") : null });
    return;
  }
  if (action === 'picked_up' || action === 'dropped_off') {
    if (!STATE.payload || STATE.payload.trip.status !== 'active') return;
    doAction(action, id, action + ':' + id);
    return;
  }
  if (action === 'sheet-cancel' || action === 'close-sheet') { closeSheet(); return; }
  if (action === 'sheet-confirm') {
    var s = STATE.sheet;
    if (s) { doAction(s.doAction, s.bookingId, s.doAction); }
    closeSheet();
    return;
  }
});

/* ---------- Init ---------- */
function boot() {
  STATE.isMock = new URLSearchParams(location.search).get('mock') === '1';
  STATE.token = getToken();
  if (!STATE.isMock && !STATE.token) { STATE.loading = false; STATE.errorType = 'invalid_token'; render(); return; }
  initGps();
  load(true);
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && !STATE.pendingKey && !STATE.errorType && !STATE.loading) load(false);
});
setInterval(function () {
  if (document.visibilityState === 'visible' && !STATE.pendingKey && !STATE.errorType && !STATE.loading) load(false);
}, 30000);

boot();

})();
</script>
