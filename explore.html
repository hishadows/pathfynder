<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find a ride · Pathfynder</title>
<meta name="description" content="Find drivers and passengers across Ontario — from WhatsApp groups, Poparide and more.">
<meta property="og:title" content="Find a ride · Pathfynder">
<meta property="og:description" content="Find drivers and passengers across Ontario — from WhatsApp groups, Poparide and more.">
<meta property="og:url" content="https://pathfynder.ca/explore">
<meta property="og:type" content="website">
<meta property="og:image" content="https://pathfynder.ca/logo.png">
<link rel="icon" type="image/png" href="/logo.png">
<style>
/* =========================================================
   TOKENS — WhatsApp light (default)
   Source of truth: design/explore-mockup.html — do not diverge.
   ========================================================= */
:root{
  --header:#008069; --header-text:#FFFFFF; --header-sub:rgba(255,255,255,.82); --header-hover:rgba(255,255,255,.12);
  --brand-bg:#FFFFFF; --brand-fg:#008069;
  --primary:#008069; --cta:#25D366; --cta-hover:#1EBE5A; --cta-text:#111B21;
  --bg:#F0F2F5; --card:#FFFFFF; --surface:#F0F2F5;
  --text:#111B21; --text-2:#667781; --divider:#E9EDEF; --line-strong:#D1D7DB; --route-line:#AEBAC1;
  --chip-soft:#D9FDD3; --chip-soft-text:#006D5B;
  --pass-bg:#E6F2FA; --pass-fg:#0A6DA3;
  --link:#027EB5;
  --wallpaper:#EFEAE2; --bubble:#FFFFFF; --bubble-name:#C0548A;
  --skeleton:#E9EDEF; --skeleton-hi:#F7F8FA;
  --overlay:rgba(11,20,26,.42);
  --on-primary:#FFFFFF; --notice-bg:#FFEECD; --notice-fg:#54656F; --star:#F5B400;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --header:#202C33; --header-text:#E9EDEF; --header-sub:#8696A0; --header-hover:rgba(233,237,239,.08);
    --brand-bg:#00A884; --brand-fg:#111B21;
    --primary:#00A884; --cta:#00A884; --cta-hover:#06CF9C; --cta-text:#111B21;
    --bg:#0B141A; --card:#202C33; --surface:#111B21;
    --text:#E9EDEF; --text-2:#8696A0; --divider:#2A3942; --line-strong:#3B4A54; --route-line:#54656F;
    --chip-soft:#0A332C; --chip-soft-text:#25D366;
    --pass-bg:#102A3A; --pass-fg:#53BDEB;
    --link:#53BDEB;
    --wallpaper:#0B141A; --bubble:#202C33; --bubble-name:#FC9775;
    --skeleton:#2A3942; --skeleton-hi:#34454F;
    --overlay:rgba(0,0,0,.62);
    --on-primary:#111B21; --notice-bg:#182229; --notice-fg:#FFD279; --star:#FFC933;
  }
}
:root[data-theme="dark"]{
  --header:#202C33; --header-text:#E9EDEF; --header-sub:#8696A0; --header-hover:rgba(233,237,239,.08);
  --brand-bg:#00A884; --brand-fg:#111B21;
  --primary:#00A884; --cta:#00A884; --cta-hover:#06CF9C; --cta-text:#111B21;
  --bg:#0B141A; --card:#202C33; --surface:#111B21;
  --text:#E9EDEF; --text-2:#8696A0; --divider:#2A3942; --line-strong:#3B4A54; --route-line:#54656F;
  --chip-soft:#0A332C; --chip-soft-text:#25D366;
  --pass-bg:#102A3A; --pass-fg:#53BDEB;
  --link:#53BDEB;
  --wallpaper:#0B141A; --bubble:#202C33; --bubble-name:#FC9775;
  --skeleton:#2A3942; --skeleton-hi:#34454F;
  --overlay:rgba(0,0,0,.62);
  --on-primary:#111B21; --notice-bg:#182229; --notice-fg:#FFD279; --star:#FFC933;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
body.no-scroll{overflow:hidden}

.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{min-height:100vh;max-width:100vw;overflow-x:clip;background:var(--bg);color:var(--text);font-size:15px;line-height:1.35;container-type:inline-size;touch-action:manipulation}
.app button{font:inherit;touch-action:manipulation}
.chip,.ride-card,.empty-card,.group-card,.prefill,.sheet,.sheet__head,.sheet__foot,.sheet__body{touch-action:manipulation}

/* App bar */
.app-bar{position:sticky;top:0;z-index:3;background:var(--header);color:var(--header-text)}
.app-bar__inner{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 8px 8px 16px}
.brand{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand-bg);color:var(--brand-fg);flex:none}
.brand .i{width:22px;height:22px;stroke-width:2.1}
.app-bar__titles{flex:1;min-width:0}
.app-bar__title{margin:0;font-size:19px;font-weight:500;line-height:1.2}
.app-bar__sub{margin:1px 0 0;font-size:13px;color:var(--header-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-bar__sub b{font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--header-hover)}

.app__col{display:flex;flex-direction:column}

/* Search panel */
.search-panel{background:var(--card);padding:12px 16px 14px;border-bottom:1px solid var(--divider);display:flex;flex-direction:column;gap:12px}
.segmented{display:flex;padding:3px;border-radius:10px;background:var(--surface)}
.segmented__opt{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer}
.segmented__opt .i{width:18px;height:18px}
.segmented__opt.is-active{background:var(--card);color:var(--primary);box-shadow:0 1px 2px rgba(11,20,26,.12)}
.route-input{display:flex;align-items:center;gap:6px;padding:2px 6px 2px 12px;border-radius:10px;background:var(--surface);position:relative}
.route-input__fields{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.route-input__fields::before{content:"";position:absolute;left:4px;top:27px;bottom:27px;border-left:2px dotted var(--route-line)}
.route-input__field{display:flex;align-items:center;gap:10px;min-height:46px;cursor:text;position:relative}
.route-input__field + .route-input__field{border-top:1px solid var(--divider)}
.route-input__dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--text-2);background:var(--surface)}
.route-input__dot--to{background:var(--primary);border-color:var(--primary)}
.route-input__label{width:36px;flex:none;font-size:12.5px;color:var(--text-2)}
.route-input__field input{flex:1;min-width:0;border:0;padding:2px 0;background:transparent;font:inherit;font-size:16px;line-height:1.2;color:var(--text);outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-input__field input::placeholder{color:var(--text-2)}
.swap-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--divider);background:var(--card);color:var(--primary);display:grid;place-items:center;cursor:pointer}
.filters{display:flex;flex-direction:column;gap:12px}
.filter-row{display:flex;flex-direction:column;gap:6px;min-width:0}
.filter-row__label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.chip-group{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chip-group::-webkit-scrollbar{display:none}
.chip-group--wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:999px;background:var(--surface);color:var(--text-2);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip .i{width:16px;height:16px}
.chip.is-active{background:var(--chip-soft);color:var(--chip-soft-text);font-weight:600}
.chip__count{font-size:12px;opacity:.75}

/* Autocomplete */
.ac-list{position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:2px;background:var(--card);border:1px solid var(--divider);border-radius:10px;box-shadow:0 4px 14px rgba(11,20,26,.16);overflow:hidden;display:none}
.ac-list.is-open{display:block}
.ac-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 14px;border:0;background:transparent;color:var(--text);font-size:15px;cursor:pointer;border-bottom:1px solid var(--divider)}
.ac-item .i{flex:none;width:16px;height:16px;color:var(--text-2)}
.ac-item span{display:block;min-width:0}
.ac-item:last-child{border-bottom:0}
.ac-item:hover,.ac-item.is-hi{background:var(--surface)}
.ac-item small{display:block;font-size:13px;color:var(--text-2)}

/* Prefill (bot link) */
.prefill{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;background:var(--card);border-bottom:1px solid var(--divider)}
.prefill > .i{color:var(--primary)}
.prefill__text{flex:1;min-width:0}
.prefill__eyebrow{display:block;font-size:12px;color:var(--text-2)}
.prefill__query{display:block;font-size:15px;font-weight:500;line-height:1.3}
.btn-text{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:0;border-radius:999px;background:var(--chip-soft);color:var(--chip-soft-text);font-size:14px;font-weight:600;cursor:pointer}
.btn-text .i{width:16px;height:16px}

/* Results head */
.results-head{display:flex;flex-direction:column;gap:10px;padding:12px 16px 2px}
.results-head .chip{background:var(--card)}
.results-head .chip.is-active{background:var(--chip-soft)}
.results-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.results-bar__count{font-size:13px;font-weight:600;color:var(--text-2)}
.sort{position:relative;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-2)}
.sort select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-size:16px;line-height:1;font-weight:600;color:var(--primary);padding:1px 20px 1px 2px;cursor:pointer;outline:none}
.sort select option{color:#111B21}
.sort .i{position:absolute;right:0;width:16px;height:16px;color:var(--primary);pointer-events:none}

/* Ride list */
.ride-list{display:flex;flex-direction:column;gap:8px;padding:8px 10px 12px}
.list-section{display:flex;align-items:center;gap:6px;margin:14px 6px 0;font-size:13px;font-weight:600;color:var(--text-2)}
.list-section .i{width:16px;height:16px}
.list-section small{font-weight:400}

/* Ride card */
.ride-card{display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px;border-radius:12px;background:var(--card);cursor:pointer;outline:none}
.ride-card:focus-visible{box-shadow:0 0 0 2px var(--primary)}
.ride-card__top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ride-card__ago{font-size:12.5px;color:var(--text-2);white-space:nowrap}
.role-badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.role-badge .i{width:15px;height:15px}
.role-badge--driver{background:var(--chip-soft);color:var(--chip-soft-text)}
.role-badge--passenger{background:var(--pass-bg);color:var(--pass-fg)}
.ride-card__main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.route{position:relative;display:flex;flex-direction:column;gap:8px;padding-left:20px;min-width:0}
.route::before{content:"";position:absolute;left:4px;top:10px;bottom:10px;border-left:2px dotted var(--route-line)}
.route__stop{position:relative;min-width:0}
.route__dot{position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--text-2);background:var(--card)}
.route__stop--to .route__dot{background:var(--primary);border-color:var(--primary)}
.route__label{display:block;font-size:12px;color:var(--text-2)}
.route__city{display:block;font-size:16.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{text-align:right}
.when__time{font-size:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.when__date{margin-top:2px;font-size:13px;color:var(--text-2);white-space:nowrap}
.when__flex{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap}
.when__flex .i{width:14px;height:14px}
.ride-meta{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.ride-meta__item{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;background:var(--surface);font-size:13px}
.ride-meta__item .i{width:15px;height:15px;color:var(--text-2)}
.ride-meta__item--price{font-weight:600}
.ride-meta__item--note{color:var(--text-2)}
.ride-card__foot{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--divider)}
.poster{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--av);background:color-mix(in srgb,var(--av) 16%,var(--card))}
.avatar--1{--av:#1FA855}.avatar--2{--av:#0A8FD6}.avatar--3{--av:#E0762B}.avatar--4{--av:#C0548A}.avatar--5{--av:#7C6BE0}
.poster__text{flex:1;min-width:0}
.poster__name{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster__sub{display:block;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster__groups{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer}
.poster__groups .i{width:14px;height:14px}
.source-badge{flex:none;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line-strong);font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap}
.source-badge .i{width:14px;height:14px}
.source-badge--whatsapp{border-color:transparent;background:var(--chip-soft);color:var(--chip-soft-text)}
.ride-card__cta{display:flex;flex-direction:column;gap:6px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;padding:8px 18px;border:0;border-radius:22px;font-size:15px;font-weight:600;line-height:1.25;text-align:center;text-decoration:none;cursor:pointer}
.btn .i{width:19px;height:19px}
.btn--wa{background:var(--cta);color:var(--cta-text)}
.btn--wa:hover{background:var(--cta-hover)}
.btn--outline{background:transparent;color:var(--text);border:1px solid var(--line-strong);font-weight:500}
.btn--outline:hover{background:var(--surface)}
.btn--outline .i{width:16px;height:16px;color:var(--text-2)}
.btn--soft{background:var(--chip-soft);color:var(--chip-soft-text)}
.btn__hint{margin:0;font-size:12px;color:var(--text-2);text-align:center}
.btn[disabled]{opacity:.6;cursor:default}

/* Facebook fallback */
.poster--top{flex:none}
.raw-post{margin:0;padding:10px 12px;border-radius:8px;background:var(--surface);border-left:3px solid var(--line-strong)}
.raw-post__text{margin:0;font-size:14.5px;line-height:1.45;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.raw-post.is-open .raw-post__text{display:block;-webkit-line-clamp:unset}
.raw-post__more{display:none;margin-top:4px;padding:0;border:0;background:none;color:var(--link);font-size:13.5px;font-weight:600;cursor:pointer}
.raw-post.has-more .raw-post__more{display:inline-block}

/* Empty */
.empty-card{background:var(--card);border-radius:12px;padding:28px 18px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.empty__art{width:92px;height:92px;border-radius:50%;background:var(--chip-soft);color:var(--primary);display:grid;place-items:center;margin-bottom:6px}
.empty__title{margin:0;font-size:18px;font-weight:600}
.empty__text{margin:0;max-width:290px;font-size:14px;color:var(--text-2)}
.empty__actions{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.suggest{width:100%;margin-top:18px;padding-top:16px;border-top:1px solid var(--divider);text-align:left}
.suggest__title{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--text-2)}
.suggest .chip{height:34px}

/* Skeleton */
.skel{position:relative;overflow:hidden;border-radius:6px;background:var(--skeleton)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--skeleton-hi),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.skel::after{animation:none}}
.skel-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.skel--pill{border-radius:999px}
.skel--circle{border-radius:50%}

/* Detail / filters / time sheet */
.sheet-layer{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;justify-content:flex-end}
.sheet-layer.is-open{display:flex}
.sheet-backdrop{position:absolute;inset:0;background:var(--overlay)}
.sheet{position:relative;display:flex;flex-direction:column;max-height:90vh;background:var(--card);color:var(--text);border-radius:16px 16px 0 0;font-size:15px;line-height:1.35}
.sheet__grabber{width:36px;height:4px;margin:8px auto 2px;border-radius:2px;background:var(--line-strong)}
.sheet__body{overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:16px}
.sheet__head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet__head .icon-btn{color:var(--text-2);margin-right:-8px}
.sheet__title{margin:0;font-size:21px;font-weight:600;line-height:1.25}
.sheet__subtitle{margin:4px 0 0;font-size:14px;color:var(--text-2)}
.sheet-block{padding-top:14px;border-top:1px solid var(--divider)}
.sheet-block__label{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--primary)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:0}
.detail-grid dt{font-size:12.5px;color:var(--text-2)}
.detail-grid dd{margin:2px 0 0;font-size:15px;font-weight:500}
.group-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.group-list li{display:flex;align-items:center;gap:10px;font-size:14.5px}
.group-list .g-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--chip-soft);color:var(--chip-soft-text);flex:none}
.group-list .g-ico .i{width:17px;height:17px}
.group-list span{flex:1;min-width:0}
.group-list small{font-size:12.5px;color:var(--text-2)}
.wa-chat{padding:12px 12px 14px 20px;border-radius:10px;background:var(--wallpaper)}
.wa-chat__day{display:table;margin:0 auto 10px;padding:4px 10px;border-radius:8px;background:var(--bubble);font-size:11.5px;font-weight:600;color:var(--text-2);letter-spacing:.03em}
.bubble{position:relative;max-width:94%;padding:6px 8px 7px 9px;border-radius:0 8px 8px 8px;background:var(--bubble);font-size:14.5px;line-height:1.4;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.bubble::before{content:"";position:absolute;left:-8px;top:0;border-top:10px solid var(--bubble);border-left:8px solid transparent}
.bubble__name{font-size:13px;font-weight:600;color:var(--bubble-name);margin-bottom:1px}
.bubble__text{white-space:pre-line;word-wrap:break-word}
.bubble__time{float:right;margin:8px 0 -4px 12px;font-size:11px;color:var(--text-2)}
.sheet__cta{display:flex;flex-direction:column;gap:6px;padding:12px 16px 16px;border-top:1px solid var(--divider);background:var(--card);border-radius:0}

/* matching, trust, filters */
.match-badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.match-badge .i{width:14px;height:14px;stroke-width:2.3}
.match-badge--direct{background:var(--primary);color:var(--on-primary)}
.match-badge--near{box-shadow:inset 0 0 0 1.5px var(--primary);color:var(--primary)}
.match-badge--none{box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--text-2);padding:0 9px}
.match-note{display:flex;align-items:flex-start;gap:6px;margin:-2px 0 0;font-size:13px;color:var(--text-2)}
.match-note .i{width:15px;height:15px;margin-top:1px;color:var(--primary)}
.match-note b{color:var(--text);font-weight:600}
.when__arrive{margin-top:1px;font-size:13px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ride-meta__item small{font-weight:400;color:var(--text-2);font-size:12px}
.poster__line{display:flex;align-items:center;gap:4px;min-width:0}
.poster__line .poster__name{flex:0 1 auto}
.verified{display:inline-flex;color:var(--primary);flex:none}
.verified .i{width:17px;height:17px}
.tag{flex:none;display:inline-flex;align-items:center;gap:4px;height:20px;margin-left:4px;padding:0 6px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--surface);color:var(--text-2);white-space:nowrap}
.tag .i{width:12px;height:12px;stroke-width:2}
.ride-card__tags{display:flex;align-items:center;gap:2px;min-width:0}
.tag--regular{background:var(--chip-soft);color:var(--chip-soft-text)}
.tag--coordinator{background:var(--pass-bg);color:var(--pass-fg)}
.rating{display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--text)}
.rating .star{width:14px;height:14px;fill:var(--star);stroke:var(--star)}
.rating__count{font-weight:400;color:var(--text-2)}
.avatar--biz{border-radius:9px;--av:#667781;color:var(--text-2);background:var(--surface)}
.avatar--biz .i{width:19px;height:19px}
.search-row{display:flex;align-items:center;gap:8px}
.search-row .chip-group{flex:1;min-width:0;margin:0;padding:0}
.filter-btn{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.filter-btn .i{width:17px;height:17px}
.filter-btn__count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:var(--on-primary);font-size:11px;display:grid;place-items:center}
.active-filters{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chip--removable{background:var(--chip-soft);color:var(--chip-soft-text);font-weight:600;padding:0 4px 0 12px;cursor:default}
.chip__x{width:24px;height:24px;border:0;border-radius:50%;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}
.chip__x .i{width:14px;height:14px}
.link-btn{flex:none;border:0;background:none;padding:0 4px;color:var(--primary);font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.results-title{margin:0;font-size:15px;font-weight:600;color:var(--text);min-width:0}
.results-title__date{display:block;font-size:13px;font-weight:400;color:var(--text-2)}
.info-line{display:flex;align-items:flex-start;gap:8px;margin:8px 10px 0;padding:10px 12px;border-radius:8px;background:var(--notice-bg);color:var(--notice-fg);font-size:13.5px;line-height:1.35}
.info-line .i{width:17px;height:17px}
.chip--suggest b{font-weight:600;color:var(--primary)}
.chip--static{cursor:default;color:var(--text)}
.chip--icon{width:36px;padding:0;justify-content:center}
.btn--primary{background:var(--primary);color:var(--on-primary)}
.btn--ghost{background:transparent;color:var(--primary);flex:0 0 auto !important;width:auto}
.btn--strong{border-color:var(--text-2);font-weight:600}
.sheet__head--title{padding:6px 16px 4px}
.sheet__head--title h2{margin:0;font-size:19px;font-weight:600}
.fs-section{padding:14px 0;border-top:1px solid var(--divider)}
.fs-title{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--primary)}
.fs-section .chip{height:34px}
.fs-section .chip small{font-size:11.5px;font-weight:400;opacity:.75}
.radio-row{display:flex;align-items:center;gap:14px;padding:8px 0;cursor:pointer}
.radio{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--text-2);display:grid;place-items:center}
.radio.is-on{border-color:var(--primary)}
.radio.is-on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.radio-row__text strong,.toggle-row__text strong{display:block;font-size:15px;font-weight:500}
.radio-row__text small,.toggle-row__text small{display:block;font-size:13px;color:var(--text-2)}
.toggle-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.toggle-row__text{flex:1;min-width:0}
.switch{position:relative;width:38px;height:22px;flex:none;border:0;border-radius:11px;background:var(--line-strong);cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.sheet__foot{display:flex;align-items:center;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--divider)}
.sheet__foot .btn--primary{flex:1}
/* route strip */
.route-strip{padding:4px 2px 0}
.route-strip__track{position:relative;height:120px;margin:0 8px}
.route-strip__track::before{content:"";position:absolute;left:0;right:0;top:40px;height:3px;border-radius:2px;background:var(--route-line)}
.route-strip__ride{position:absolute;top:40px;height:3px;border-radius:2px;background:var(--primary)}
.rs-dot{position:absolute;top:35px;width:13px;height:13px;border-radius:50%;transform:translateX(-50%)}
.rs-dot--driver{background:var(--text-2)}
.rs-dot--you{background:var(--card);box-shadow:inset 0 0 0 3px var(--primary)}
.rs-dot--both{background:var(--text-2);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--primary)}
.rs-km{position:absolute;top:49px;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--text-2);white-space:nowrap}
.rs-label{position:absolute;top:66px;width:110px;transform:translateX(-50%);text-align:center;font-size:12px;line-height:1.3;color:var(--text-2)}
.rs-label b{display:block;font-size:13px;font-weight:600;color:var(--text)}
.rs-label--you{top:0;color:var(--primary)}
.rs-label--you b{color:var(--primary)}
.rs-label--start{transform:translateX(-8px);text-align:left}
.rs-label--end{transform:translateX(calc(-100% + 8px));text-align:right}
.route-strip__legend{display:flex;gap:14px;font-size:12px;color:var(--text-2)}
.route-strip__legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:16px;height:3px;border-radius:2px;display:inline-block}
.lg--driver{background:var(--route-line)}.lg--you{background:var(--primary)}
.raw-post--desc{background:transparent;border-left:0;padding:0}
.raw-post--desc .raw-post__text{-webkit-line-clamp:4}
.trust-list{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.trust-list li{display:flex;align-items:center;gap:10px;font-size:14.5px}
.trust-list li > span:last-child{color:var(--text-2)}
.trust-list .rating{min-width:22px}
.trust-ico{display:inline-flex;color:var(--primary)}
.trust-ico .i{width:18px;height:18px}

/* swipe to original message, exact time */
.ride-card__swipe{position:relative;overflow:hidden;touch-action:pan-y}
.swipe-track{position:relative;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.ride-card__swipe.is-swiped .swipe-track{transform:translateX(calc(-100% - 14px))}
.ride-card__swipe.is-dragging .swipe-track{transition:none}
.ride-card__swipe.is-dragging{user-select:none;-webkit-user-select:none}
.swipe-pane--details{display:flex;flex-direction:column;gap:10px}
.swipe-pane--message{position:absolute;top:0;bottom:0;left:calc(100% + 14px);width:100%;overflow-y:auto;scrollbar-width:none;
  padding:8px 10px 18px 18px;border-radius:8px;background:var(--wallpaper);
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent)}
.swipe-pane--message::-webkit-scrollbar{display:none}
.bubble--card{max-width:100%;font-size:14px}
.swipe-dots{display:flex;align-items:center;gap:5px;margin:-2px 0 -4px}
.swipe-dot{width:6px;height:6px;padding:0;border:0;border-radius:3px;background:var(--line-strong);cursor:pointer;transition:width .2s,background .2s}
.swipe-dot.is-on{width:14px;background:var(--primary)}
.swipe-hint{margin-left:6px;font-size:11.5px;color:var(--text-2)}
.exact-row{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--divider);border-radius:10px;background:transparent;color:var(--text);text-align:left;cursor:pointer}
.exact-row > .i:first-child{color:var(--primary)}
.exact-row > .i:last-child{width:16px;height:16px;color:var(--text-2)}
.exact-row__text{flex:1;min-width:0}
.exact-row__text strong{display:block;font-size:15px;font-weight:500}
.exact-row__text small{display:block;font-size:12.5px;color:var(--text-2)}
.exact-row__val{font-size:14px;font-weight:600;color:var(--primary)}
.time-wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:2px;margin:6px 0 4px}
.time-wheel::before{content:"";position:absolute;left:0;right:0;top:50%;height:46px;transform:translateY(-50%);border-radius:10px;background:var(--surface);pointer-events:none}
.wheel-col{position:relative;height:150px;width:72px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.wheel-col::-webkit-scrollbar{display:none}
.wheel-col::before,.wheel-col::after{content:"";display:block;height:56px}
.wheel-col span{height:38px;display:grid;place-items:center;font-size:19px;color:var(--text-2);opacity:.4;font-variant-numeric:tabular-nums;scroll-snap-align:center}
.wheel-col span.is-sel{opacity:1;font-size:26px;font-weight:600;color:var(--text)}
.wheel-col[data-field="ampm"] span{font-size:17px}
.wheel-col[data-field="ampm"] span.is-sel{font-size:21px;color:var(--primary)}
.wheel-sep{position:relative;font-size:24px;font-weight:600;margin-top:-4px}
.time-summary{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 14px;font-size:13.5px;color:var(--text-2)}
.time-summary .i{width:16px;height:16px;color:var(--primary)}
.time-summary b{color:var(--text);font-weight:600}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);z-index:30;background:var(--text);color:var(--bg);font-size:13.5px;font-weight:500;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);text-align:center}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Group link card (Option A — chat invite) */
.group-card{background:var(--wallpaper);border-radius:12px;padding:14px 14px 16px;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.group-card__bubble{align-self:flex-start;max-width:88%;background:var(--bubble);border-radius:0 10px 10px 10px;padding:9px 11px;box-shadow:0 1px .5px rgba(11,20,26,.13);position:relative;font-size:14.5px;line-height:1.4}
.group-card__bubble::before{content:"";position:absolute;left:-8px;top:0;border-top:10px solid var(--bubble);border-left:8px solid transparent}
.group-card__name{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:2px}
.group-card__row{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:24px;padding:4px 4px 4px 14px}
.group-card__row input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;color:var(--text);outline:none}
.group-card__paste{height:36px;padding:0 12px;border:0;border-radius:18px;background:var(--chip-soft);color:var(--chip-soft-text);font-size:13.5px;font-weight:600;flex:none;cursor:pointer}
.group-card__send{width:44px;height:44px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-text);flex:none;display:grid;place-items:center;cursor:pointer}
.group-card__send .i{width:20px;height:20px}
.group-card__send[disabled]{opacity:.6;cursor:default}
.group-card__hint{margin:0;font-size:12px;color:var(--text-2);text-align:center}
.group-card__result{margin:0;font-size:13px;background:var(--notice-bg);color:var(--notice-fg);padding:8px 10px;border-radius:8px}
.group-card__bubble--sent{align-self:flex-end;background:var(--chip-soft);color:var(--text);border-radius:10px 0 10px 10px}
.group-card__bubble--sent::before{display:none}
.group-card__bubble--sent::after{content:"";position:absolute;right:-8px;top:0;border-top:10px solid var(--chip-soft);border-right:8px solid transparent}
.group-card__link{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-card__ticks{display:block;text-align:right;margin-top:2px;font-size:11px;color:var(--primary)}

/* Footer */
.app-footer{padding:18px 16px 28px;text-align:center;font-size:13px;color:var(--text-2)}
.app-footer p{margin:0 0 4px}
.app-footer strong{color:var(--text);font-weight:600}
.app-footer a{color:var(--primary);font-weight:600;text-decoration:none}

/* =========================================================
   DESKTOP ≥ 760px (container query on .app)
   ========================================================= */
@container (min-width: 760px){
  .app-bar__inner{max-width:720px;margin:0 auto;padding:8px 0}
  .app__col{max-width:720px;margin:0 auto;padding-top:16px}
  .search-panel{border:1px solid var(--divider);border-radius:12px;padding:14px 16px 16px}
  .route-input__fields{flex-direction:row}
  .route-input__fields::before{display:none}
  .route-input__field{flex:1}
  .route-input__field + .route-input__field{border-top:0;border-left:1px solid var(--divider);padding-left:14px}
  .swap-btn{order:0}
  .swap-btn .i{transform:rotate(90deg)}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .chip-group{margin:0;padding:0}
  .filters .chip-group{flex-wrap:wrap}
  .active-filters{margin:0;padding:0}
  .search-row .chip-group{flex:0 1 auto}
  .info-line{margin:8px 0 0}
  .results-head{padding:16px 2px 2px}
  .ride-list{padding:8px 0 16px;gap:10px}
  .ride-card{padding:14px 18px 16px}
  .ride-card__foot{flex-direction:row;align-items:center;gap:16px}
  .ride-card__cta{width:260px;flex:none}
  .prefill{border:1px solid var(--divider);border-radius:12px}
}
</style>
</head>

(function () {

function applyPendingRows() {

function backgroundRefresh() {
  if (state.refreshInFlight) return;
  if (document.visibilityState !== 'visible') return;
  if (isSheetOpen()) return;
  if (!db || state.loading || state.error) return;
  var params = rpcParams();
  state.refreshInFlight = true;
  dbg('explore_search (auto-refresh) params:', params);
  db.rpc('explore_search', params).then(function (res) {
    if (res.error) throw res.error;
    return res.data || [];
  }).catch(function (err) {
    if (err && (err.code === '42883' || /does not exist/i.test(err.message || ''))) {
      return window.EXPLORE_MOCK ? window.EXPLORE_MOCK.search(params) : [];
    }
    throw err;
  }).then(function (rows) {
    dbg('explore_search (auto-refresh) rows:', rows.length);
    var existingIds = {};
    state.rows.forEach(function (r) { existingIds[r.id] = true; });
    var newCount = rows.filter(function (r) { return !existingIds[r.id]; }).length;
    if (newCount > 0) { state.pendingRows = rows; showNewRidesPill(newCount); }
  }).catch(function (err) { dbg('explore_search (auto-refresh) failed:', err); })
    .finally(function () { state.refreshInFlight = false; });
}
var refreshTimer = null;

}

}

  } else if (document.visibilityState === 'visible') {

var popularPlacesPromise = null;
function fetchPopularPlaces() {
  if (popularPlacesPromise) return popularPlacesPromise;
  popularPlacesPromise = db
    ? db.from('places').select('name,lat,lng').gte('popularity', 20).then(function (res) { return res.data || []; }).catch(function () { return []; })
    : Promise.resolve([]);
  return popularPlacesPromise;
}
function haversineKm(lat1, lng1, lat2, lng2) {
  var R = 6371, toRad = Math.PI / 180;
  var dLat = (lat2 - lat1) * toRad, dLng = (lng2 - lng1) * toRad;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function resolveNearestPlace() {
  return fetchPopularPlaces().then(function (places) {
    if (!places.length || !state.loc.coords) return;
    var best = null, bestD = Infinity;
    places.forEach(function (p) {
      if (p.lat == null || p.lng == null) return;
      var d = haversineKm(state.loc.coords.lat, state.loc.coords.lng, p.lat, p.lng);
      if (d < bestD) { bestD = d; best = p; }
    });
    if (best) {
      state.loc.nearestName = best.name;
      state.from = best.name;
      state.fromPlace = { name: best.name, lat: best.lat, lng: best.lng };
      state.unresolved.from = null;
      state.origin = 'gps';
    }
  });
}
function getLocation() {
  /* No sheets or modals — every outcome is reflected inline in locationCard(). */
  state.loc.status = 'locating';
  navigator.geolocation.getCurrentPosition(function (pos) {
    state.loc.coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    state.loc.status = 'granted';
    resolveNearestPlace().then(function () { refreshLanding(); });
  }, function (err) {
    if (err && err.code === 1) {
      state.loc.status = 'denied';
      render();
    } else {
      state.loc.status = 'prompt';
      render();
      toast('Couldn’t get your location — try again or pick From/To');
    }
  }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
}
function checkGeoPermission() {
  if (!('geolocation' in navigator)) { state.loc.status = 'unsupported'; render(); return; }
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(function (st) {
      if (st.state === 'granted') { getLocation(); return; }
      state.loc.status = st.state === 'denied' ? 'denied' : 'prompt';
      render();
    }).catch(function () {
      state.loc.status = 'prompt'; render();
    });
  } else {
    state.loc.status = 'prompt'; render();
  }
}
function bootLanding() {
  refreshLanding();
  checkGeoPermission();
}

/* ---------- Contact (RPC only — no numbers ever reach the client) ---------- */
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('is-on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove('is-on'); }, 3200);
}
function contact(id, btn) {
  if (btn) btn.setAttribute('disabled', 'disabled');
  var srcRow = state.rows.find(function (r) { return r.id === id; });
  var isWhatsapp = srcRow && srcRow.source === 'whatsapp';
  var popup = null;
  if (!isWhatsapp) {
    /* mobile browsers block window.open() called after an await — open it
       synchronously inside this tap handler, then redirect it once we know the URL */
    try { popup = window.open('about:blank', '_blank'); } catch (e) { popup = null; }
  }
  db.rpc('explore_contact', { p_id: id }).then(function (res) {
    if (res.error) throw res.error;
    var row = Array.isArray(res.data) ? res.data[0] : res.data;
    if (!row || !row.url) throw new Error('empty');
    if (row.contact_type === 'whatsapp') location.href = row.url;
    else if (popup) popup.location.href = row.url;
    else location.href = row.url;
  }).catch(function (err) {
    if (popup) { try { popup.close(); } catch (e2) {} }
    var msg = (err && err.message) || '';
    if (/rate_limited/i.test(msg)) toast('Too many requests — try again in a bit');
    else if (/not_available/i.test(msg)) toast('This ride is no longer available');
    else toast('Something went wrong — try again');
  }).finally(function () { if (btn) btn.removeAttribute('disabled'); });
}

    '<p class="time-summary">' + icon('clock') + 'Rides leaving <b>' + timeSummary() + '</b></p>' +
    '<section class="fs-section"><h3 class="fs-title">How flexible are you?</h3><div class="chip-group chip-group--wrap">' +
    flexOpts.map(function (o) { return '<button type="button" class="chip js-flex" data-value="' + o[0] + '"' + (pendingTime.flexMin === o[0] ? ' style="background:var(--chip-soft);color:var(--chip-soft-text);font-weight:600"' : '') + '>' + o[1] + '</button>'; }).join('') +
    '</div></section></div>' +
    '<div class="sheet__foot"><button type="button" class="btn btn--ghost js-cancel-time">Cancel</button><button type="button" class="btn btn--primary js-set-time">' + setLabel() + '</button></div>';
}
function wireTimeWheels() {
  ['hour', 'minute', 'ampm'].forEach(function (field) {
    var colEl = document.querySelector('.wheel-col[data-field="' + field + '"]');
    if (!colEl) return;
    var items = colEl.querySelectorAll('span');
    var selIdx = 0;
    items.forEach(function (it, i) { if (it.classList.contains('is-sel')) selIdx = i; });
    colEl.scrollTop = selIdx * 38;
    var snap = function () {
      var idx = Math.round(colEl.scrollTop / 38);
      idx = Math.max(0, Math.min(items.length - 1, idx));
      items.forEach(function (it, i) { it.classList.toggle('is-sel', i === idx); });
      var v = items[idx].getAttribute('data-v');
      pendingTime[field] = field === 'ampm' ? v : Number(v);
      updateTimeSheetLabels();
    };
    var t;
    colEl.addEventListener('scroll', function () {
      clearTimeout(t);
      t = setTimeout(snap, 120);
    });
    colEl.addEventListener('scrollend', function () { clearTimeout(t); snap(); });
  });
}

/* ---------- Sheet layer plumbing ---------- */
function openSheetLayer() { document.getElementById('sheetLayer').classList.add('is-open'); document.body.classList.add('no-scroll'); }
function closeSheetLayer() { document.getElementById('sheetLayer').classList.remove('is-open'); document.body.classList.remove('no-scroll'); document.getElementById('sheetBody').innerHTML = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.getElementById('sheetLayer').classList.contains('is-open')) closeSheetLayer(); });

/* ---------- Detail sheet ---------- */
function routeStrip(r) {
  var points = [
    { pct: 0, kind: 'driver', label: cityOf(r.origin_label), sub: 'Driver starts' },
    { pct: r.pickup_pct, kind: 'you', label: 'Your pickup', sub: r.pickup_km + ' km from you' },
  ];
  if (r.dropoff_pct === 100) points.push({ pct: 100, kind: 'both', label: cityOf(r.dest_label), sub: 'Your drop-off · driver\'s end' });
  else points.push({ pct: r.dropoff_pct, kind: 'you', label: 'Your drop-off', sub: r.dropoff_km + ' km from you' });
  var segs = [{ a: 0, b: r.pickup_pct, km: Math.round(r.route_km * (r.pickup_pct / 100)) + ' km' }, { a: r.pickup_pct, b: r.dropoff_pct, km: Math.round(r.route_km * ((r.dropoff_pct - r.pickup_pct) / 100)) + ' km' }];
  var dots = points.map(function (p, i) {
    var edge = (i === 0 ? ' rs-label--start' : (i === points.length - 1 ? ' rs-label--end' : '')) + (p.kind === 'you' ? ' rs-label--you' : '');
    return '<span class="rs-dot rs-dot--' + p.kind + '" style="left:' + p.pct + '%"></span><span class="rs-label' + edge + '" style="left:' + p.pct + '%"><b>' + esc(p.label) + '</b>' + esc(p.sub) + '</span>';
  }).join('');
  var kms = segs.map(function (g) { return '<span class="rs-km" style="left:' + ((g.a + g.b) / 2) + '%">' + g.km + '</span>'; }).join('');
  return '<div class="route-strip"><div class="route-strip__track"><span class="route-strip__ride" style="left:' + r.pickup_pct + '%;width:' + (r.dropoff_pct - r.pickup_pct) + '%"></span>' + kms + dots + '</div>' +
    '<div class="route-strip__legend"><span><i class="lg lg--driver"></i>Driver\'s route</span><span><i class="lg lg--you"></i>Your part of the trip</span></div></div>';
}
function renderRideDetail(r) {
  var t = r.ride_date ? timeText(r) : null;
  var grid = [
    ['Departs', t || 'Flexible'],
    r.arrive_time ? ['Arrives', fmtTime(r.arrive_time)] : null,
    r.seats ? [r.role === 'driver' ? 'Seats left' : 'Seats needed', r.seats] : null,
    r.price_num != null ? ['Price', '$' + r.price_num + ' per seat'] : null,
    r.luggage ? ['Luggage', r.luggage] : null,
    r.recurring_label ? ['Repeats', r.recurring_label] : null,
  ].filter(Boolean).map(function (kv) { return '<div><dt>' + kv[0] + '</dt><dd>' + esc(kv[1]) + '</dd></div>'; }).join('');
  var trust = [
    r.rating ? ('<li><span class="trust-ico" style="color:var(--star)"><svg class="i" style="fill:currentColor"><use href="#i-star"/></svg></span><span><b style="color:var(--text)">' + r.rating.toFixed(1) + '</b> from ' + r.rating_count + ' ratings</span></li>') : '',
    r.verified ? ('<li><span class="trust-ico">' + icon('verified') + '</span><span>Verified on ' + SOURCE_LABEL[r.source] + '</span></li>') : '',
  ].join('');
  var groups = (r.groups && r.groups.length) ? ('<section class="sheet-block"><h3 class="sheet-block__label">Shared on WhatsApp in ' + plural(r.groups.length, 'group') + '</h3><ul class="group-list">' +
    r.groups.map(function (g) { return '<li><span class="g-ico">' + icon('groups') + '</span><span>' + esc(g.name) + '</span><small>' + ago(g.posted_at) + '</small></li>'; }).join('') + '</ul></section>') : '';
  var bubble = '';
  if (r.source === 'whatsapp' && r.raw_text && r.groups && r.groups[0]) {
    var first = new Date(r.groups[0].posted_at);
    var bt = first.toLocaleTimeString('en-CA', { hour:'numeric', minute:'2-digit' }).replace(/\./g, '').toUpperCase();
    bubble = '<section class="sheet-block"><h3 class="sheet-block__label">Original message</h3><div class="wa-chat">' +
      '<span class="wa-chat__day">' + (dayDiff(r.groups[0].posted_at.slice(0, 10)) === -1 ? 'YESTERDAY' : 'TODAY') + '</span>' +
      '<div class="bubble"><div class="bubble__name">' + esc(r.display_name) + '</div><span class="bubble__text">' + esc(r.raw_text) + '</span><span class="bubble__time">' + bt + '</span></div></div></section>';
  }
  var ctaHTML = r.source === 'whatsapp'
    ? '<button type="button" class="btn btn--wa" data-action="contact" data-id="' + r.id + '">' + icon('chat') + 'Message ' + esc(r.display_name.split(' ')[0]) + ' on WhatsApp</button><p class="btn__hint">Opens WhatsApp with a message ready to send</p>'
    : '<button type="button" class="btn btn--outline btn--strong" data-action="contact" data-id="' + r.id + '">View on ' + SOURCE_LABEL[r.source] + icon('external') + '</button><p class="btn__hint">Opens ' + SOURCE_DOMAIN[r.source] + ' to book · you\'ll leave Pathfynder</p>';
  var strip = (r.role === 'driver' && r.match_type === 'along_route' && r.route_km != null && r.pickup_pct != null && r.dropoff_pct != null)
    ? ('<section class="sheet-block"><h3 class="sheet-block__label">How this ride fits your trip</h3>' + routeStrip(r) + '</section>') : '';
  var description = r.description
    ? ('<section class="sheet-block"><h3 class="sheet-block__label">From the ' + (r.role === 'passenger' ? 'rider' : 'driver') + '</h3><blockquote class="raw-post raw-post--desc"><p class="raw-post__text">' + esc(r.description) + '</p><button class="raw-post__more" type="button">Read more</button></blockquote></section>') : '';
  return '<div class="sheet__grabber"></div><div class="sheet__body">' +
    '<div class="sheet__head">' + matchBadge(r) + '<button type="button" class="icon-btn js-close-sheet" aria-label="Close">' + icon('x') + '</button></div>' +
    '<div><h2 class="sheet__title">' + esc(cityOf(r.origin_label)) + ' → ' + esc(cityOf(r.dest_label)) + '</h2>' +
    '<p class="sheet__subtitle">' + esc(r.ride_date ? dayLabel(r.ride_date, true) : 'Date not given') + ' · ' + (t ? esc(t) : 'Time flexible') + (r.arrive_time ? (' → ' + fmtTime(r.arrive_time)) : '') + '</p>' + matchNote(r) + '</div>' +
    strip + '<section class="sheet-block"><dl class="detail-grid">' + grid + '</dl></section>' + description +
    '<section class="sheet-block"><h3 class="sheet-block__label">' + (r.role === 'driver' ? 'Driver' : 'Rider') + '</h3>' + poster(r, 'poster--top') + (trust ? ('<ul class="trust-list">' + trust + '</ul>') : '') + '</section>' +
    groups + bubble + '</div><div class="sheet__cta">' + ctaHTML + '</div>';
}
function openDetail(id) {
  var r = state.rows.find(function (x) { return x.id === id; });
  if (!r) return;
  document.getElementById('sheetBody').innerHTML = renderRideDetail(r);
  openSheetLayer();
  checkClamps();
}

/* ---------- Read more (only when clamped) ---------- */
function checkClamps() {
  document.querySelectorAll('.raw-post').forEach(function (b) {
    if (b.classList.contains('is-open')) return;
    var p = b.querySelector('.raw-post__text');
    if (!p) return;
    b.classList.toggle('has-more', p.scrollHeight > p.clientHeight + 1);
  });
}

/* ---------- Swipe: details ⇄ original message ---------- */
function setSwipe(box, on) {
  box.classList.toggle('is-swiped', on);
  var card = box.closest('.ride-card');
  card.querySelectorAll('.swipe-dot').forEach(function (d, i) { d.classList.toggle('is-on', on ? i === 1 : i === 0); });
  var hint = card.querySelector('.swipe-hint');
  if (hint) hint.textContent = on ? 'Original message · swipe back' : 'Swipe for original message';
}
function restoreSwipe() {}
var drag = null, GAP = 14;
document.addEventListener('pointerdown', function (e) {
  var box = e.target.closest('[data-swipe]'); if (!box) return;
  drag = { box: box, x: e.clientX, y: e.clientY, dx: 0, w: box.clientWidth, on: box.classList.contains('is-swiped'), moved: false };
});
document.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.abs(dx) < 6) return;
    if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    drag.moved = true; drag.box.classList.add('is-dragging');
  }
  drag.dx = dx;
  var x = Math.max(-(drag.w + GAP), Math.min(0, (drag.on ? -(drag.w + GAP) : 0) + dx));
  drag.box.querySelector('.swipe-track').style.transform = 'translateX(' + x + 'px)';
});
function endDrag() {
  if (!drag) return;
  var box = drag.box, dx = drag.dx, on = drag.on, moved = drag.moved; drag = null;
  box.classList.remove('is-dragging'); box.querySelector('.swipe-track').style.transform = '';
  if (!moved) return;
  if (!on && dx < -50) setSwipe(box, true); else if (on && dx > 50) setSwipe(box, false);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* ---------- Wiring ---------- */
function setSearchInputs() {
  var fromEl = document.querySelector('.js-from'), toEl = document.querySelector('.js-to');
  if (!fromEl) return;
  wireAutocomplete(fromEl, document.getElementById('acFrom'), function (place) {
    state.from = place.name; state.fromPlace = place; state.unresolved.from = null; state.origin = 'typed';
    maybeSearch();
  });
  wireAutocomplete(toEl, document.getElementById('acTo'), function (place) {
    state.to = place.name; state.toPlace = place; state.unresolved.to = null;
    maybeSearch();
  });
  fromEl.addEventListener('change', function () {
    var v = fromEl.value.trim();
    var pickedLabel = state.fromPlace ? (state.fromPlace.label || state.fromPlace.name) : null;
    if (!v) { state.from = ''; state.fromPlace = null; state.unresolved.from = null; state.origin = null; searchOrRender(); }
    else if (state.fromPlace && v !== pickedLabel) { state.from = fromEl.value; state.fromPlace = null; state.unresolved.from = v; state.origin = null; render(); }
    else if (!state.fromPlace) { state.from = fromEl.value; }
  });
  toEl.addEventListener('change', function () {
    var v = toEl.value.trim();
    var pickedLabel = state.toPlace ? (state.toPlace.label || state.toPlace.name) : null;
    if (!v) { state.to = ''; state.toPlace = null; state.unresolved.to = null; searchOrRender(); }
    else if (state.toPlace && v !== pickedLabel) { state.to = toEl.value; state.toPlace = null; state.unresolved.to = v; render(); }
    else if (!state.toPlace) { state.to = toEl.value; }
  });
}
function maybeSearch() {
  if (state.fromPlace) {
    state.editing = !state.toPlace;
    runSearch();
  } else {
    render();
  }
}
function wireApp() {
  setSearchInputs();
  var picker = document.getElementById('datePicker');
  if (picker) {
    picker.min = torontoTodayStr(0);
    if (state.date) picker.value = state.date;
    var onPickerDate = function () {
      if (!picker.value || picker.value === state.date) return;
      state.date = picker.value; state.dateChip = 'Pick';
      dbg('date chip: calendar tap -> p_date', state.date);
      searchOrRender();
    };
    picker.addEventListener('change', onPickerDate);
    picker.addEventListener('input', onPickerDate);
  }
}
document.addEventListener('click', function (e) {
  var t = e.target;

  var noop = t.closest('[data-action="noop"]');
  if (noop) { e.preventDefault(); return; }

  var newRidesPill = t.closest('#newRidesPill');
  if (newRidesPill) { applyPendingRows(); return; }

  var closeSheet = t.closest('[data-action="close-sheet"], .js-close-sheet, .js-cancel-time');
  if (closeSheet) { closeSheetLayer(); return; }

  var contactBtn = t.closest('[data-action="contact"]');
  if (contactBtn) { contact(contactBtn.getAttribute('data-id'), contactBtn); return; }

  var more = t.closest('.raw-post__more');
  if (more) { var b = more.closest('.raw-post'); b.classList.toggle('is-open'); more.textContent = b.classList.contains('is-open') ? 'Show less' : 'Read more'; return; }

  var dot = t.closest('.swipe-dot');
  if (dot) { var box = dot.closest('.ride-card').querySelector('[data-swipe]'); setSwipe(box, dot.parentElement.querySelectorAll('.swipe-dot')[1] === dot); return; }

  var seg = t.closest('.js-seg');
  if (seg) { state.mode = seg.getAttribute('data-value'); state.rows = []; searchOrRender(); return; }

  var swap = t.closest('.js-swap');
  if (swap) {
    var f = state.from, tp = state.fromPlace; state.from = state.to; state.fromPlace = state.toPlace; state.to = f; state.toPlace = tp;
    state.origin = state.fromPlace ? 'typed' : null;
    searchOrRender();
    return;
  }

  var useLoc = t.closest('.js-use-location');
  if (useLoc) { getLocation(); return; }

  var locRetry = t.closest('.js-loc-retry');
  if (locRetry) { getLocation(); return; }

  var dateChip = t.closest('.js-date');
  if (dateChip) {
    var v = dateChip.getAttribute('data-value');
    state.dateChip = v; state.date = v === 'Today' ? torontoTodayStr(0) : torontoTodayStr(1);
    dbg('date chip: ' + v + ' tap -> p_date', state.date);
    searchOrRender();
    return;
  }

  var edit = t.closest('.js-edit');
  if (edit) { state.editing = true; render(); return; }

  var card = t.closest('.ride-card');
  if (card && !t.closest('button') && !t.closest('a')) { openDetail(card.getAttribute('data-ride-id')); return; }

  var openFilters = t.closest('.js-open-filters');
  if (openFilters) { openFiltersSheet(); return; }
  var openTime = t.closest('.js-open-time, .js-open-time-from-filters');
  if (openTime) { openTimeSheet(); return; }

  var removeF = t.closest('.js-remove-filter');
  if (removeF) { removeFilter(removeF.getAttribute('data-key')); return; }
  var clearF = t.closest('.js-clear-filters');
  if (clearF) { state.filters = defaultFilters(); searchOrRender(); return; }

  var fMatch = t.closest('.js-f-match');
  if (fMatch) {
    pendingFilters.match = fMatch.getAttribute('data-value') || null;
    var radios = fMatch.closest('.js-radios');
    if (radios) radios.querySelectorAll('.radio').forEach(function (r) { r.classList.remove('is-on'); });
    var radioEl = fMatch.querySelector('.radio'); if (radioEl) radioEl.classList.add('is-on');
    updateFiltersCount();
    return;
  }
  var fMulti = t.closest('.js-f-multi');
  if (fMulti) {
    var group = fMulti.getAttribute('data-group'), val = fMulti.getAttribute('data-value');
    var isOn;
    if (group === 'sources') {
      var key = val.toLowerCase();
      var i = pendingFilters.sources.indexOf(key);
      if (i > -1) { pendingFilters.sources.splice(i, 1); isOn = false; } else { pendingFilters.sources.push(key); isOn = true; }
    } else if (group === 'ride_type') {
      var rtField = val.toLowerCase();
      pendingFilters[rtField] = !pendingFilters[rtField];
      isOn = pendingFilters[rtField];
    } else {
      var j = pendingFilters.time_of_day.indexOf(val.toLowerCase());
      if (j > -1) { pendingFilters.time_of_day.splice(j, 1); isOn = false; } else { pendingFilters.time_of_day.push(val.toLowerCase()); isOn = true; }
    }
    fMulti.style.cssText = isOn ? 'background:var(--chip-soft);color:var(--chip-soft-text);font-weight:600' : '';
    updateFiltersCount();
    return;
  }
  var fToggle = t.closest('.js-f-toggle');
  if (fToggle) {
    var field = fToggle.getAttribute('data-field');
    pendingFilters[field] = !pendingFilters[field];
    fToggle.setAttribute('aria-checked', String(pendingFilters[field]));
    updateFiltersCount();
    return;
  }
  var resetF = t.closest('.js-reset-filters, .js-clear-pending');
  if (resetF) {
    pendingFilters = defaultFilters();
    var fSb = document.querySelector('#sheetBody .sheet__body');
    var fScrollTop = fSb ? fSb.scrollTop : 0;
    document.getElementById('sheetBody').innerHTML = renderFiltersSheet();
    var fSb2 = document.querySelector('#sheetBody .sheet__body'); if (fSb2) fSb2.scrollTop = fScrollTop;
    updateFiltersCount();
    return;
  }
  var applyF = t.closest('.js-apply-filters');
  if (applyF) { state.filters = pendingFilters; closeSheetLayer(); searchOrRender(); return; }

  var flexChip = t.closest('.js-flex');
  if (flexChip) {
    pendingTime.flexMin = Number(flexChip.getAttribute('data-value'));
    flexChip.parentElement.querySelectorAll('.js-flex').forEach(function (c) { c.style.cssText = ''; });
    flexChip.style.cssText = 'background:var(--chip-soft);color:var(--chip-soft-text);font-weight:600';
    updateTimeSheetLabels();
    return;
  }
  var clearTime = t.closest('.js-clear-time');
  if (clearTime) { state.filters.time = null; state.filters.flexMin = null; closeSheetLayer(); searchOrRender(); return; }
  var setTime = t.closest('.js-set-time');
  if (setTime) {
    var h24 = to24h(pendingTime.hour, pendingTime.ampm);
    state.filters.time = String(h24).padStart(2, '0') + ':' + String(pendingTime.minute).padStart(2, '0');
    state.filters.flexMin = pendingTime.flexMin;
    closeSheetLayer();
    searchOrRender();
    return;
  }

  var nearbyDate = t.closest('.js-nearby-date');
  if (nearbyDate) { state.date = nearbyDate.getAttribute('data-date'); state.dateChip = 'Pick'; runSearch(); return; }

  var retry = t.closest('.js-retry');
  if (retry) { searchOrRender(); return; }

  var groupPaste = t.closest('.js-group-paste');
  if (groupPaste) {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (text) {
        var input = document.querySelector('.js-group-url');
        if (input && text) input.value = text.trim();
      }).catch(function () {});
    }
    return;
  }
  var groupSubmit = t.closest('.js-group-submit');
  if (groupSubmit) { submitGroupLink(); return; }
});
document.addEventListener('change', function (e) {
  if (e.target.classList.contains('js-sort')) { state.sort = e.target.value; render(); }
});

/* ---------- Boot ---------- */
function boot() {
  if (state.landingEnabled) { bootLanding(); return; }
  render();
  var cache = loadPlacesCache();
  var jobs = [];
  if (state.from) {
    if (cache && cache.from && normPlace(cache.from.name) === normPlace(state.from)) {
      state.fromPlace = cache.from; state.from = cache.from.name; state.unresolved.from = null;
    } else {
      jobs.push(resolvePlace(state.from).then(function (p) {
        if (p) { state.fromPlace = p; state.from = p.name; state.unresolved.from = null; }
        else state.unresolved.from = state.from;
      }));
    }
  }
  if (state.to) {
    if (cache && cache.to && normPlace(cache.to.name) === normPlace(state.to)) {
      state.toPlace = cache.to; state.to = cache.to.name; state.unresolved.to = null;
    } else {
      jobs.push(resolvePlace(state.to).then(function (p) {
        if (p) { state.toPlace = p; state.to = p.name; state.unresolved.to = null; }
        else state.unresolved.to = state.to;
      }));
    }
  }
  Promise.all(jobs).then(function () {
    if (!state.date) state.date = torontoTodayStr(0);
    if (state.fromPlace) { state.editing = !state.toPlace; runSearch(); }
    else { state.editing = true; render(); }
  });
}
if (db) boot(); else render();
if (db && document.visibilityState === 'visible') startAutoRefresh();
})();
</script>
